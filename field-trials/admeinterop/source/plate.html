    gsap.set([B.cells, B.t1, B.t2, B.rev, B.doc], { opacity: 1 });
    gsap.set(B.top, { ...CORNER, opacity: 0 });
    show(B.top, s + 0.1, 0.25);
    tl.to(B.top, { x: 0, y: 0, scale: 1, duration: 0.9, ease: "power2.inOut" }, s + 0.3);
    show(B.body, s + 1.15, 0.35);
    const at = [W("c1", "Agents propose"), W("c1", "People approve"), W("c1", "every answer"), W("c1", "how sure"),
                W("c2", "next revision") - 0.1, end("c2") + 0.1, end("c2") + 0.5];
    B.rows.forEach((r, k) => {
      show(r.g, at[k] - 0.1, 0.25);
      if (r.pill) tl.fromTo(r.pill, { scale: 1.45 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, at[k] - 0.1);
    });
  }
  return tl.duration();
};
</script>
