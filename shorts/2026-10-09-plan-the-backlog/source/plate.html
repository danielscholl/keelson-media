<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 13 &nbsp;·&nbsp; PLAN THE BACKLOG</span>
  </div>
  <div id="boardName"><span id="bn-team">HOW A TEAM WORKS</span><span id="bn-graph">THE GRAPH SAYS WHAT'S READY</span><span id="bn-why">A PLAN IS DATA</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker>
    <marker id="ahn" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c8d2e0"/></marker>
  </defs>
  <!-- HOW A TEAM WORKS -->
  <g id="team" opacity="0">
    <g id="t-line" opacity="0">
      <text x="200" y="230" class="mono" font-size="21" letter-spacing="3" fill="#51607a">ONE PLAN, ONE ORDER</text>
      <g class="mono" font-size="20">
      <rect x="200" y="255" width="200" height="56" rx="8" fill="#fff" stroke="#51607a" stroke-width="2"/><text x="300" y="290" text-anchor="middle" fill="#51607a">explore</text>
      <rect x="440" y="255" width="200" height="56" rx="8" fill="#fff" stroke="#51607a" stroke-width="2"/><text x="540" y="290" text-anchor="middle" fill="#51607a">plan</text>
      <rect x="680" y="255" width="200" height="56" rx="8" fill="#fff" stroke="#51607a" stroke-width="2"/><text x="780" y="290" text-anchor="middle" fill="#51607a">build</text>
      <rect x="920" y="255" width="200" height="56" rx="8" fill="#fff" stroke="#51607a" stroke-width="2"/><text x="1020" y="290" text-anchor="middle" fill="#51607a">check</text></g>
      <text x="1160" y="292" class="mono" font-size="20" fill="#51607a">fine for an experiment</text>
    </g>
    <g id="t-back" opacity="0">
      <text x="200" y="420" class="mono" font-size="21" letter-spacing="3" fill="#8a5a1f">A TEAM'S BACKLOG</text>
      <g id="t-cards"></g>
    </g>
    <g id="t-two" opacity="0">
      <circle cx="1520" cy="560" r="22" fill="none" stroke="#1e3a5f" stroke-width="3"/><path d="M1484,630 C1484,595 1556,595 1556,630" fill="none" stroke="#1e3a5f" stroke-width="3"/>
      <circle cx="1640" cy="560" r="22" fill="none" stroke="#1e3a5f" stroke-width="3"/><path d="M1604,630 C1604,595 1676,595 1676,630" fill="none" stroke="#1e3a5f" stroke-width="3"/>
      <text x="1580" y="680" text-anchor="middle" class="mono" font-size="19" fill="#1e3a5f">two ready units, two hands</text>
    </g>
  </g>
  <!-- THE GRAPH SAYS WHAT'S READY -->
  <g id="graph" opacity="0"><g id="g-edges"></g><g id="g-nodes"></g>
    <g id="g-legend" opacity="0"><rect x="200" y="760" width="22" height="22" rx="4" fill="#e8f3ec" stroke="#2f8f5b" stroke-width="2"/><text x="235" y="778" class="mono" font-size="19" fill="#0f1b2d">ready: everything it waits on is closed</text></g>
  </g>
  <!-- A PLAN IS DATA -->
  <g id="why" opacity="0">
    <g id="y-cols">
      <g id="y-a" opacity="0"><rect x="200" y="220" width="620" height="360" rx="14" fill="#0d1429"/>
        <text x="230" y="270" class="mono" font-size="21" fill="#9aa3c0">factory/backlog.json</text>
        <text x="230" y="320" class="mono" font-size="21" fill="#dfe6f0">{ "key": "scaffold", … }</text>
        <text x="230" y="360" class="mono" font-size="21" fill="#dfe6f0">{ "key": "catalog", … }</text>
        <text x="230" y="400" class="mono" font-size="21" fill="#dfe6f0">…</text>
        <text x="230" y="450" class="mono" font-size="21" fill="#f2c66d">"edges": [ catalog → scaffold, … ]</text>
        <text x="510" y="640" text-anchor="middle" font-size="28" fill="#0f1b2d">read · edit · seed again</text></g>
      <g id="y-b" opacity="0"><rect x="1000" y="220" width="720" height="360" rx="14" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
        <text x="1360" y="300" text-anchor="middle" class="mono" font-size="22" fill="#2f8f5b">nothing built yet</text>
        <text x="1360" y="360" text-anchor="middle" class="mono" font-size="22" fill="#2f8f5b">no model planned it</text>
        <text x="1360" y="450" text-anchor="middle" font-size="30" font-weight="600" fill="#0f1b2d">next: agents work the graph</text>
        <text x="1360" y="500" text-anchor="middle" font-size="26" fill="#51607a">the way a team would</text></g>
    </g>
    <g id="y-recap" opacity="0"><rect x="400" y="300" width="1120" height="220" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="400" text-anchor="middle" font-size="48" font-weight="300" letter-spacing="7" fill="#1e3a5f" opacity="0">PLAN THE GRAPH</text>
      <text id="y-r2" x="960" y="470" text-anchor="middle" font-size="34" font-weight="300" letter-spacing="5" fill="#8a5a1f" opacity="0">LET THE GRAPH SAY WHAT'S NEXT</text></g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  // HOW A TEAM WORKS
  { show($("t-line"), T.team.s + 0.3);
    const cards = ["scaffold", "catalog", "store", "design", "API", "visuals", "views"];
    show($("t-back"), W("n1", "keeps a backlog") - 0.2);
    cards.forEach((c, i) => { const x = 200 + (i % 4) * 280, y = 450 + Math.floor(i / 4) * 90, g = el("g", { opacity: 0 }, $("t-cards"));
      el("rect", { x, y, width: 240, height: 62, rx: 8, fill: i === 0 ? "#e8f3ec" : "#fff", stroke: i === 0 ? "#2f8f5b" : "#1e3a5f", "stroke-width": 2.5 }, g);
      el("text", { x: x + 120, y: y + 39, "text-anchor": "middle", class: "mono", "font-size": 20, fill: "#0f1b2d" }, g, c);
      show(g, W("n1", "small units") - 0.2 + i * 0.1, 0.2); });
    show($("t-two"), W("n1", "Two people") - 0.2);
  }
  // THE GRAPH SAYS WHAT'S READY
  { const L = [["scaffold"], ["catalog", "store", "design"], ["catalog API", "visuals"], ["chills API", "landing view", "detail view"], ["polish"], ["acceptance"]];
    const pos = {}; const nodes = $("g-nodes"), edges = $("g-edges");
    L.forEach((lv, li) => lv.forEach((n, k) => { const x = 140 + li * 290, y = 380 - (lv.length - 1) * 70 + k * 140; pos[n] = [x, y]; }));
    const E = [["catalog","scaffold"],["store","scaffold"],["design","scaffold"],["catalog API","catalog"],["visuals","catalog"],["visuals","design"],["chills API","store"],["chills API","catalog API"],["landing view","catalog API"],["landing view","visuals"],["detail view","chills API"],["detail view","visuals"],["polish","landing view"],["polish","detail view"],["acceptance","polish"]];
    const eg = E.map(([a, b]) => { const [x1, y1] = pos[b], [x2, y2] = pos[a]; return el("path", { d: `M${x1 + 230},${y1 + 30} C${x1 + 260},${y1 + 30} ${x2 - 30},${y2 + 30} ${x2 - 6},${y2 + 30}`, stroke: "#c8d2e0", "stroke-width": 2.5, fill: "none", "marker-end": "url(#ahn)", opacity: 0 }, edges); });
    const ng = {}; Object.entries(pos).forEach(([n, [x, y]]) => { const g = el("g", { opacity: 0 }, nodes);
      const r = el("rect", { x, y, width: 230, height: 60, rx: 10, fill: "#fff", stroke: "#51607a", "stroke-width": 2 }, g);
      el("text", { x: x + 115, y: y + 38, "text-anchor": "middle", class: "mono", "font-size": 20, fill: "#0f1b2d" }, g, n); ng[n] = [g, r]; });
    const s = T.graph.s;
    Object.values(ng).forEach(([g], i) => show(g, s + 0.2 + i * 0.06, 0.25)); eg.forEach((e, i) => show(e, s + 0.5 + i * 0.04, 0.25));
    const ready = (n, at) => tl.to(ng[n][1], { attr: { fill: "#e8f3ec", stroke: "#2f8f5b", "stroke-width": 3 }, duration: 0.3 }, at);
    const done = (n, at) => tl.to(ng[n][1], { attr: { fill: "#dfe6f0", stroke: "#1e3a5f", "stroke-width": 2 }, duration: 0.3 }, at);
    ready("scaffold", W("n5", "Until the scaffold") - 0.1);
    const t3 = W("n5", "three beads"); done("scaffold", t3 - 0.3); ["catalog", "store", "design"].forEach((n) => ready(n, t3));
    const t4 = W("n5", "Then the API"); ["catalog", "store", "design"].forEach((n) => done(n, t4 - 0.3)); ["catalog API", "visuals"].forEach((n) => ready(n, t4));
    tl.to(ng["chills API"][1], { attr: { fill: "#e8f3ec", stroke: "#2f8f5b" }, duration: 0.3 }, W("n5", "the store") );
    const t5 = W("n5", "two views"); ["catalog API", "visuals", "chills API"].forEach((n) => done(n, t5 - 0.3)); ["landing view", "detail view"].forEach((n) => ready(n, t5));
    const t6 = W("n5", "polish pass"); ["landing view", "detail view"].forEach((n) => done(n, t6 - 0.3)); ready("polish", t6);
    const t7 = W("n5", "end to end"); done("polish", t7 - 0.2); ready("acceptance", t7);
    show($("g-legend"), W("n5", "Ready means") - 0.2);
  }
  // A PLAN IS DATA
  { show($("y-b"), W("n8", "Nothing has been built") - 0.1);
    show($("y-a"), W("n8", "The plan is data") - 0.2);
    const p = W("n9", "Plan the graph");
    tl.to($("y-cols"), { opacity: 0.15, duration: 0.5 }, p - 0.5);
    show($("y-recap"), p - 0.5, 0.4); show($("y-r1"), p - 0.1); show($("y-r2"), W("n9", "Let the graph") - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
