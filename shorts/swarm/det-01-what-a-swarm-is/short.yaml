lines:
  - { id: n0, scene: open, at: 1.0, text: "Swarm detail one. What a swarm is. One agent on a big question answers alone, and you can't watch it think." }
  - { id: n1, scene: b-crew, at: n1, text: "A swarm is a small team instead. A lead that owns the outcome. Workers it spawns as the work calls for them. And a channel they all talk in, which you can read along." }
  - { id: n2, scene: b-agent, at: n2, text: "An agent here is not a running process. It's an identity, an inbox, and a session that can be resumed. Nothing sits waiting. Only the dispatcher runs: when a message reaches an agent, it wakes it for one turn on that resumed session." }
  - { id: n3, scene: launch, at: 0.3, text: "Here's a real one. Which job queue should a five person team use? Scout is the smallest plan: three agents, a one dollar ceiling, and no project, so it can only talk." }
  - { id: n4, scene: live, at: 13.9, text: "Start it, and the lead is the only face on the card." }
  - { id: n4b, scene: live, at: faces - 0.4, text: "Then it spawns two advocates, and there they are. One for Postgres, one for Redis and SQS." }
  - { id: n5, scene: chan, at: 2.6, text: "In the channel, each advocate makes its case and goes after the other's weak spots. Every message names who it's for, and only that agent wakes to answer. You read the whole argument, as it happens." }
  - { id: n6, scene: done, at: 5.0, text: "Forty four seconds, twelve turns, about ten cents. The outcome is one recommendation: start on Postgres, and move to SQS when benchmarks say the database is hurting. It names what it couldn't check, and even that both advocates drifted toward SQS." }
  - { id: n7, scene: b-team, at: n7, text: "That's a team, not a pipeline. A workflow runs steps you already chose. A swarm decides who it needs, lets them disagree, and shows you the argument." }
  - { id: n8, scene: b-team, at: n8, text: "Next, how to read one while it runs." }
  - { id: n9, scene: close, at: 1.6, text: "Keelson. Lay the keel, raise the ribs." }
