lines:
  - { id: n0, scene: open, at: 1.0, text: "Swarm detail three. Scout, Crew, Fleet. How much team does a question need?" }
  - { id: n1, scene: b-plans, at: n1, text: "Three plans set the team and its ceilings. Scout: three agents, a hundred fifty thousand tokens, a dollar. Crew: five, a million, ten dollars. Fleet: eight, three million, sixty." }
  - { id: n2, scene: launch, at: lead-picker - 1.4, text: "The lead and the workers get separate model pickers. The lead plans and judges, so it gets the stronger model. The workers carry the volume." }
  - { id: n3, scene: launch, at: summary + 0.3, text: "First, a Postgres question on Scout: one reviewer per option, as far as the seats allow." }
  - { id: n4, scene: launch, at: typed2 + 0.4, text: "Then the same question, word for word, on Crew." }
  - { id: n5, scene: scout, at: 0.6, text: "Scout has three seats, and the lead takes one. So two reviewers fit: replicas and cache. Nobody argues for the bigger instance." }
  - { id: n6, scene: crew, at: 22.9, text: "Crew has room. One reviewer per option, and a seat still open." }
  - { id: n7, scene: rows, at: 2.9, text: "Side by side: ten turns each. Scout took thirty four seconds and about nine cents. Crew took forty six seconds and about twenty seven cents. Three times the cost, for one more voice." }
  - { id: n8, scene: sview, at: 4.9, text: "Scout's lead says so itself: the bigger instance didn't fit, so it covered that option alone." }
  - { id: n9, scene: cview, at: 90.5, text: "Crew's three reviewers land on the same advice: tune first, then size up. Here the extra seat bought a voice, not a new answer." }
  - { id: n10, scene: b-pick, at: n10, text: "So pick by the question. Scout for a narrow one, or a first pass. Crew for most: investigate, debate, decide. Fleet for wide problems worth the spend, like the factory in figure fourteen." }
  - { id: n11, scene: b-pick, at: n11, text: "Next, who a message wakes." }
  - { id: n12, scene: close, at: 1.6, text: "Keelson. Lay the keel, raise the ribs." }
