  #header { position:absolute; left:96px; right:96px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;

  #progress { display:flex; align-items:center; gap:14px; }
  #count { position:relative; width:130px; white-space:nowrap; height:22px; }
  #count span { position:absolute; right:0; top:0; opacity:0; }
  #squares { display:flex; gap:5px; }
  #squares i { width:13px; height:13px; border:1.5px solid var(--keel); display:block; }

  #captions { position:absolute; left:0; right:0; bottom:38px; display:flex; justify-content:center; }

  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>

<script src="gsap.min.js"></script>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const C = { keel:"#1e3a5f", rib:"#2f6fb0", brass:"#b5803a", brassInk:"#8a5a1f", ink:"#0f1b2d", muted:"#51607a", green:"#2f8f5b", paleGreen:"#e6f3ea" };

function build(T) {
  // T: { scene: {id, s, n, d, e, text} } board start, narration start, narration duration, board end
  const W = (sc, word, off = 0) => { const i = T[sc].text.indexOf(word); if (i < 0) throw new Error(`${sc}: ${word}`); return T[sc].n + T[sc].d * (i / T[sc].text.length) + off; };
  const boards = Object.keys(T);
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.6 } });
  const draw = (target, t, dur = 0.9, ease = "power2.inOut") => tl.to(target, { strokeDashoffset: 0, duration: dur, ease }, t);
  const show = (target, t, dur = 0.5, extra = {}) => tl.to(target, { opacity: 1, duration: dur, ...extra }, t);
  const hide = (target, t, dur = 0.5, extra = {}) => tl.to(target, { opacity: 0, duration: dur, ...extra }, t);
  const pulseKeel = (t) => tl.to("#keel", { stroke: C.brass, duration: 0.3, yoyo: true, repeat: 1 }, t);

  // header progress and captions
  const sq = $("#squares"), cnt = $("#count");
  boards.forEach((b, i) => {
    sq.appendChild(document.createElement("i"));
    const s = document.createElement("span"); s.textContent = `${String(i + 1).padStart(2, "0")} / ${String(boards.length).padStart(2, "0")}`; cnt.appendChild(s);
  });
  const squares = $$("#squares i"), counts = $$("#count span");
  boards.forEach((b, i) => {
    tl.set(squares[i], { backgroundColor: C.keel }, T[b].s);
    tl.set(counts[i], { opacity: 1 }, T[b].s); if (i) tl.set(counts[i - 1], { opacity: 0 }, T[b].s);
    const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = T[b].text; $("#captions").appendChild(cap);
    tl.to(cap, { opacity: 1, duration: 0.2 }, T[b].n - 0.1); tl.to(cap, { opacity: 0, duration: 0.25 }, T[b].n + T[b].d + 0.25);
  });

  // hook: a chat fills, then the session ends and it is gone
  const barSpec = [[950, 378, 246, "u"], [726, 410, 380], [726, 436, 300], [1010, 470, 186, "u"], [726, 502, 340], [726, 528, 220]];
  const mkBars = () => barSpec.map(([x, y, w, u]) => { const b = el("rect", { x, y, width: w, height: 16, rx: 8, fill: u ? C.brass : C.keel, "fill-opacity": u ? 0.5 : 0.32 }, $("#bars")); gsap.set(b, { scaleX: 0, transformOrigin: u ? "right center" : "left center" }); return b; });
  const bars = mkBars();
  tl.set("#agent", { opacity: 0 }, 0); show("#agent", 0, 0.4, { ease: "none" });
  bars.forEach((b, i) => tl.to(b, { scaleX: 1, duration: 0.45 }, 0.3 + i * 0.42));
  tl.to("#caret", { opacity: 0, duration: 0.01, repeat: 5, yoyo: true, repeatDelay: 0.38 }, 0.2);
  tl.to("#caret", { attr: { y: 558 }, duration: 0.01 }, 2.8); hide("#caret", 2.9, 0.1);
  tl.fromTo("#stamp", { scale: 1.5 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", transformOrigin: "50% 50%", immediateRender: false }, W("hook", "Then") + 0.5);
  bars.forEach((b, i) => tl.to(b, { y: 50, opacity: 0, duration: 0.7, ease: "power2.in" }, W("hook", "what it learned") + i * 0.12));

  // keel: laid under the agent; the machine is the boundary
  const K = T.keel;
  hide("#stamp", K.s, 0.4);
  draw("#keel", K.n + 0.1, 1.6); show("#keelLabel", K.n + 1.3);
  draw("#agentPost", W("keel", "sits under"), 0.6); show("#agentBolt", W("keel", "sits under") + 0.5, 0.2);
  show("#machine", W("keel", "One small"), 0.8); show("#cloud", W("keel", "No hosted"), 0.5);

  // chat: a new conversation, from the browser or the terminal
  const Ch = T.chat;
  hide(["#machine", "#cloud"], Ch.s, 0.5);
  const bars2 = mkBars();
  bars2.forEach((b, i) => tl.to(b, { scaleX: 1, duration: 0.4 }, W("chat", "talk") - 0.6 + i * 0.35));
  show(["#devBrowser", "#devL1"], W("chat", "browser") - 0.1, 0.4);
  show(["#devTerm", "#devL2"], W("chat", "terminal") - 0.1, 0.4);

  // state: the agent moves left, a database and the keychain bolt on
  const St = T.state;
  hide("#devices", St.s, 0.4);
  tl.to("#agent", { x: -360, scale: 0.78, transformOrigin: "50% 50%", duration: 0.9, ease: "power3.inOut" }, St.s);
  tl.to("#agentPost", { attr: { x1: 600, x2: 600, y1: 532 }, duration: 0.9, ease: "power3.inOut" }, St.s);
  tl.to("#agentBolt", { attr: { cx: 600 }, duration: 0.9, ease: "power3.inOut" }, St.s);
  show("#db", W("state", "state") - 0.2, 0.6); draw("#dbPost", W("state", "state"), 0.6); show("#dbBolt", W("state", "state") + 0.5, 0.2);
  const items = $$(".item");
  ["Conversations", "runs", "memories"].forEach((w, i) => show(items[i], W("state", w) - 0.1, 0.4));
  show("#approved", W("state", "approve") + 0.1, 0.3);
  for (let k = 0; k < 9; k++) {
    const p = el("circle", { cx: 800, cy: 430, r: 7, opacity: 0 }, $("#particles"));
    const t0 = W("state", "Conversations") + k * 0.42;
    tl.set(p, { opacity: 1 }, t0); tl.to(p, { attr: { cx: 966, cy: 486 }, duration: 0.8, ease: "power1.inOut" }, t0); tl.set(p, { opacity: 0 }, t0 + 0.8);
  }
  show("#key", W("state", "secrets"), 0.5); draw("#keyPost", W("state", "secrets") + 0.2, 0.6); show("#keyBolt", W("state", "secrets") + 0.7, 0.2);

  // workflows: YAML on the left, the graph it describes on the right
  const Wf = T.workflows;
  hide(["#state", "#agent", "#agentPost", "#agentBolt"], Wf.s, 0.5);
  show("#yamlPanel", Wf.s + 0.3, 0.5); draw("#yamlPost", Wf.s + 0.5, 0.5);
  const Y = [["", "name", " ship-a-fix"], ["", "nodes", ":"], ["  - ", "id", ": plan"], ["    ", "prompt", ": Plan the change"], ["  - ", "id", ": build"],
    ["    ", "prompt", ": Make the change"], ["    ", "depends_on", ": [plan]"], ["  - ", "id", ": test"], ["    ", "bash", ": bun test"],
    ["    ", "depends_on", ": [plan]"], ["  - ", "id", ": approve"], ["    ", "approval", ": { message: Ship it? }"], ["    ", "depends_on", ": [build, test]"]];
  Y.forEach(([ind, k, v], i) => {
    const t = el("text", { x: 264, y: 290 + i * 28, opacity: 0, style: "white-space:pre" }, $("#yamlLines"));
    el("tspan", { fill: C.muted }, t, ind); el("tspan", { fill: C.keel, "font-weight": 700 }, t, k); el("tspan", { fill: C.muted }, t, v.startsWith(":") ? v : `:${v}`);
    show(t, Wf.n + 0.6 + i * 0.22, 0.15);
  });
  const N = [["plan", 1240, 270, "prompt"], ["build", 1090, 410, "prompt"], ["test", 1390, 410, "bash"]].map(([name, x, y, kind]) => {
    const g = el("g", { opacity: 0 }, $("#nodes"));
    const r = el("rect", { x: x - 105, y: y - 31, width: 210, height: 62, rx: 8, fill: "#fff", stroke: C.keel, "stroke-width": 2.2 }, g);
    el("text", { x: x - 84, y: y + 9, "font-size": 28, fill: C.ink }, g, name);
    el("text", { x: x + 86, y: y + 6, "text-anchor": "end", class: "mono", "font-size": 16, fill: C.muted }, g, kind);
    return { g, r, x, y };
  });
  const gate = el("g", { opacity: 0 }, $("#nodes"));
  const gd = el("rect", { x: 1202, y: 522, width: 76, height: 76, fill: "#fff", stroke: C.brass, "stroke-width": 2.6, transform: "rotate(45 1240 560)" }, gate);
  el("text", { x: 1300, y: 568, "font-size": 28, fill: C.ink }, gate, "approve");
  el("text", { x: 1300, y: 594, class: "mono", "font-size": 16, fill: C.muted }, gate, "approval");
  const graphT = W("workflows", "graph");
  [...N.map((n) => n.g), gate].forEach((g, i) => tl.fromTo(g, { scale: 0.85 }, { scale: 1, opacity: 1, duration: 0.4, transformOrigin: "50% 50%", immediateRender: false }, graphT - 0.4 + i * 0.18));
  $$(".edge").forEach((e, i) => draw(e, graphT + 0.1 + i * 0.12, 0.5));
  draw("#dagPost", graphT + 0.4, 0.5); show("#dagBolt", graphT + 0.8, 0.2);
  const pulseNode = (r, t, color) => tl.to(r, { stroke: color, strokeWidth: 4.5, duration: 0.25, yoyo: true, repeat: 1 }, t);
  const ag = W("workflows", "agent steps"); pulseNode(N[0].r, ag, C.rib); pulseNode(N[1].r, ag, C.rib);
  pulseNode(N[2].r, W("workflows", "shell steps"), C.rib);
  tl.to(gd, { fill: "#f6ead8", duration: 0.3, yoyo: true, repeat: 1 }, W("workflows", "approval gates"));
  const runOnce = (t0, k, speed) => {
    const steps = [[N[0].r], [N[1].r, N[2].r], [gd]];
    steps.forEach((rs, i) => rs.forEach((r) => tl.to(r, { fill: C.paleGreen, stroke: C.green, duration: 0.2 }, t0 + i * speed)));
    const chip = el("g", { opacity: 0 }, $("#runs"));
    el("rect", { x: 1440 + k * 120, y: 640, width: 106, height: 32, rx: 16, fill: "#fff", stroke: C.green, "stroke-width": 2 }, chip);
    el("text", { x: 1493 + k * 120, y: 661, "text-anchor": "middle", class: "mono", "font-size": 15, fill: C.green }, chip, `run ${k + 1} ✓`);
    show(chip, t0 + 3 * speed, 0.25);
    const reset = t0 + 3 * speed + 0.25;
    if (k < 2) steps.flat().forEach((r) => tl.to(r, { fill: "#fff", stroke: r === gd ? C.brass : C.keel, duration: 0.15 }, reset));
    return reset + 0.15;
  };
  let rt = W("workflows", "run in the same");
  rt = runOnce(rt, 0, 0.45); rt = runOnce(rt, 1, 0.3); runOnce(rt, 2, 0.3);

  // providers: one agent slot, four providers, chosen per chat or per step
  const Pv = T.providers;
  hide(["#yamlPanel", "#runs"], Pv.s, 0.4);
  N.forEach((n) => tl.to(n.r, { fill: "#fff", stroke: C.keel, duration: 0.3 }, Pv.s)); tl.to(gd, { fill: "#fff", stroke: C.brass, duration: 0.3 }, Pv.s);
  tl.set("#agent", { x: -360, scale: 0.78 }, Pv.s); show("#agent", Pv.s + 0.2, 0.5);
  tl.set("#agentPost", { attr: { x1: 600, x2: 600, y1: 532 } }, Pv.s); tl.set("#agentBolt", { attr: { cx: 600 } }, Pv.s);
  show(["#agentPost", "#agentBolt"], Pv.s + 0.2, 0.5);
  const P = ["Claude", "Copilot", "Codex", "Pi"].map((name, i) => {
    const x = 405 + i * 130, g = el("g", { opacity: 0 }, $("#pills"));
    const r = el("rect", { x: x - 59, y: 238, width: 118, height: 44, rx: 22, fill: "#fff", stroke: C.keel, "stroke-width": 1.8 }, g);
    const t = el("text", { x, y: 267, "text-anchor": "middle", "font-size": 22, fill: C.keel }, g, name);
    return { g, r, t, name };
  });
  P.forEach((p, i) => show(p.g, Pv.n + 0.4 + i * 0.12, 0.3));
  P.forEach((p, i) => {
    const t = W("providers", p.name === "Pi" ? "Pi," : `${p.name},`) - 0.05;
    tl.to(p.r, { fill: C.keel, duration: 0.15 }, t); tl.to(p.t, { fill: "#fff", duration: 0.15 }, t);
    if (i < 3) { tl.to(p.r, { fill: "#fff", duration: 0.2 }, t + 0.5); tl.to(p.t, { fill: C.keel, duration: 0.2 }, t + 0.5); }
  });
  show("#chatTag", W("providers", "per chat"), 0.3);
  [["claude", N[0]], ["codex", N[1]]].forEach(([name, n], i) => {
    const g = el("g", { opacity: 0 }, $("#pills"));
    el("rect", { x: n.x + 20, y: n.y - 50, width: 104, height: 30, rx: 15, fill: "#fff", stroke: C.brass, "stroke-width": 2 }, g);
    el("text", { x: n.x + 72, y: n.y - 30, "text-anchor": "middle", class: "mono", "font-size": 15, fill: C.brassInk }, g, name);
    show(g, W("providers", "per step") + i * 0.2, 0.3);
  });

  // ways in: the browser, the command line, and MCP, each bolted to the keel
  const Wy = T.ways;
  hide(["#agent", "#agentPost", "#agentBolt", "#pills", "#chatTag", "#dag"], Wy.s, 0.45);
  const TABS = ["Chat", "Workflows", "Memory", "Usage", "Data", "Issues", "Deploy"];
  let tx = 512; const tabs = TABS.map((name, i) => {
    const g = el("g", { opacity: i < 4 ? 1 : 0 }, $("#tabs"));
    const t = el("text", { x: tx, y: 272, "font-size": 20, fill: i < 4 ? C.muted : C.brassInk, "font-weight": i < 4 ? 400 : 600 }, g, name);
    const w = name.length * 11 + 4;
    const u = el("rect", { x: tx, y: 284, width: w, height: 3.5, fill: C.brass, opacity: 0 }, g);
    tx += w + 36; return { g, t, u };
  });
  const pane = (fn) => { const g = el("g", { opacity: 0 }, $("#panes")); fn(g); return g; };
  const panes = [
    pane((g) => { [[520, 320, 380, 0], [1000, 380, 400, 1], [520, 440, 460, 0], [1080, 500, 320, 1], [520, 560, 300, 0]].forEach(([x, y, w, u]) => el("rect", { x, y, width: w, height: 38, rx: 19, fill: u ? C.brass : C.keel, "fill-opacity": u ? 0.35 : 0.18 }, g)); }),
    pane((g) => { [[600, 360], [800, 330], [800, 430], [1000, 380], [1200, 380]].forEach(([x, y]) => el("rect", { x, y, width: 140, height: 44, rx: 6, fill: C.paleGreen, stroke: C.green, "stroke-width": 2 }, g));
      el("path", { d: "M740,382 L800,352 M740,382 L800,452 M940,352 L1000,402 M940,452 L1000,402 M1140,402 L1200,402", stroke: C.keel, "stroke-width": 2, fill: "none" }, g); }),
    pane((g) => { [0, 1, 2, 3].forEach((i) => { el("rect", { x: 540, y: 330 + i * 72, width: 640, height: 48, rx: 6, fill: "#fff", stroke: C.keel, "stroke-opacity": 0.35 }, g);
      el("rect", { x: 560, y: 348 + i * 72, width: 300 + (i % 2) * 120, height: 12, rx: 6, fill: C.keel, "fill-opacity": 0.25 }, g);
      el("text", { x: 1160, y: 362 + i * 72, "text-anchor": "end", class: "mono", "font-size": 16, fill: i < 3 ? C.green : C.brassInk }, g, i < 3 ? "approved" : "proposed"); }); }),
    pane((g) => { [90, 150, 120, 210, 170, 250, 190, 230].forEach((h, i) => el("rect", { x: 560 + i * 100, y: 620 - h, width: 56, height: h, fill: C.rib, "fill-opacity": 0.55 }, g));
      el("line", { x1: 540, y1: 620, x2: 1380, y2: 620, stroke: C.keel, "stroke-width": 2 }, g); }),
  ];
  tl.set("#browser", { x: -480, y: 0, scale: 0.5, transformOrigin: "50% 50%" }, Wy.s + 0.5);
  tl.set("#browserPost", { attr: { x1: 480, x2: 480, y1: 543 } }, Wy.s + 0.5); tl.set("#browserBolt", { attr: { cx: 480 } }, Wy.s + 0.5);
  const tb = W("ways", "The browser");
  show(["#browser", "#lblBrowser"], tb - 0.2, 0.4); draw("#browserPost", tb, 0.5); show("#browserBolt", tb + 0.4, 0.2);
  for (let i = 0; i < 4; i++) {
    const t = tb + 0.2 + i * 0.5;
    if (i) { tl.to(tabs[i - 1].u, { opacity: 0, duration: 0.12 }, t); tl.to(tabs[i - 1].t, { fill: C.muted, duration: 0.12 }, t); hide(panes[i - 1], t, 0.15); }
    tl.to(tabs[i].u, { opacity: 1, duration: 0.12 }, t); tl.to(tabs[i].t, { fill: C.keel, duration: 0.12 }, t); show(panes[i], t, 0.2);
  }
  const tc = W("ways", "keelson command");
  show(["#term", "#lblTerm"], tc - 0.3, 0.4); draw("#termPost", tc, 0.5); show("#termBolt", tc + 0.4, 0.2);
  $$("#term .tl").forEach((l, i) => show(l, tc + 0.1 + i * 0.35, 0.15));
  tl.set("#agent", { x: 540, y: -10, scale: 0.55 }, Wy.s + 0.6);
  const tm = W("ways", "MCP");
  show("#agent", tm - 0.3, 0.4); show("#mcpLabel2", tm, 0.3);
  tl.set("#mcpArrow2", { opacity: 1 }, W("ways", "drive")); draw("#mcpArrow2", W("ways", "drive"), 0.6);

  // access: MCP is read only or full control, with an optional token
  const Ac = T.access;
  tl.to(["#browser", "#lblBrowser", "#browserPost", "#term", "#lblTerm", "#termPost"], { opacity: 0.25, duration: 0.4 }, Ac.s);
  show("#access", Ac.n - 0.2, 0.4);
  const ro = W("access", "Read only"), fc = W("access", "full control"), tk = W("access", "token");
  show("#accReadDot", ro, 0.15); tl.to("#accReadT", { fill: C.ink, duration: 0.15 }, ro);
  hide("#accReadDot", fc, 0.15); tl.to("#accReadT", { fill: C.muted, duration: 0.15 }, fc);
  show("#accFullDot", fc, 0.15); tl.to("#accFullT", { fill: C.ink, duration: 0.15 }, fc);
  show("#accTok", tk - 0.1, 0.3);

  // standalone: everything so far, with nothing added
  const Sa = T.standalone;
  hide("#access", Sa.s, 0.4);
  tl.to(["#browser", "#lblBrowser", "#browserPost", "#term", "#lblTerm", "#termPost"], { opacity: 1, duration: 0.4 }, Sa.s);
  pulseKeel(W("standalone", "keel")); pulseKeel(W("standalone", "useful") + 0.2);

  // ribs: the browser moves aside, three ribs rise, each adds a screen
  const Rb = T.ribs;
  hide(["#term", "#lblTerm", "#termPost", "#termBolt", "#agent", "#mcpArrow2", "#mcpLabel2", "#lblBrowser"], Rb.s, 0.45);
  tl.to("#browser", { x: -440, y: -95, scale: 0.62, duration: 0.9, ease: "power3.inOut" }, Rb.s);
  tl.to("#browserPost", { attr: { x1: 520, x2: 520, y1: 476 }, duration: 0.9, ease: "power3.inOut" }, Rb.s);
  tl.to("#browserBolt", { attr: { cx: 520 }, duration: 0.9, ease: "power3.inOut" }, Rb.s);
  const RIBS = [["@keelson/rib-data", "→ a data platform"], ["@keelson/rib-issues", "→ an issue tracker"], ["@keelson/rib-deploy", "→ a cluster CLI"]];
  const ribs = RIBS.map(([pkg, what], i) => {
    const x = 1000 + i * 280, g = el("g", {}, $("#ribs"));
    const path = el("path", { d: `M${x},800 C${x - 8},700 ${x - 14},560 ${x + 8},446`, fill: "none", stroke: C.brass, "stroke-width": 13, "stroke-linecap": "round", class: "draw", pathLength: 1 }, g);
    const bolt = el("circle", { cx: x, cy: 800, r: 10, fill: C.keel, stroke: C.brass, "stroke-width": 4, opacity: 0 }, g);
    const call = el("g", { opacity: 0 }, g);
    el("rect", { x: x - 128, y: 356, width: 256, height: 62, rx: 6, fill: "rgba(243,245,248,.95)", stroke: C.brass, "stroke-width": 1.8 }, call);
    el("text", { x, y: 382, "text-anchor": "middle", class: "mono", "font-size": 16, fill: C.brassInk }, call, pkg);
    el("text", { x, y: 405, "text-anchor": "middle", class: "mono", "font-size": 14, fill: C.muted }, call, what);
    return { g, path, bolt, call, x };
  });
  ribs.forEach((r, i) => { const t = W("ribs", "raise ribs") + i * 0.45; draw(r.path, t, 0.7, "power2.out"); show(r.bolt, t, 0.2); });
  ribs.forEach((r, i) => show(r.call, W("ribs", "package") + i * 0.3, 0.35));
  [4, 5, 6].forEach((k, i) => show(tabs[k].g, W("ribs", "new screens") + i * 0.25, 0.3));
  pulseKeel(W("ribs", "without"));

  // reveal: everything resolves into the frame of a hull
  const Rv = T.reveal;
  hide(["#browser", "#browserPost", "#browserBolt", ...ribs.map((r) => r.call)], Rv.s, 0.5);
  ribs.forEach((r, i) => tl.to(r.g, { x: [560, 960, 1360][i] - r.x, duration: 1.0, ease: "power3.inOut" }, Rv.s + 0.3));
  [460, 660, 760, 860, 1060, 1160, 1260, 1460].forEach((x, i) => {
    const f = el("line", { x1: x, y1: 800, x2: x, y2: 470, class: "draw", pathLength: 1 }, $("#frames"));
    draw(f, Rv.s + 1.0 + i * 0.07, 0.5);
  });
  draw("#hull", Rv.s + 0.9, 1.6);
  tl.to("#keel", { attr: { x1: 420, x2: 1560 }, duration: 1.0, ease: "power3.inOut" }, Rv.s + 0.3);
  tl.to("#hull", { fill: "rgba(255,255,255,.35)", duration: 0.8 }, Rv.s + 2.2);
  show("#waterline", Rv.s + 1.8, 0.6, { opacity: 0.38 }); show("#wheelhouse", Rv.s + 2.3, 0.5);
  show("#title9", W("reveal", "One backbone") + 0.1, 0.8);
  return tl;
}

window.setup = async (T) => {
  await document.fonts.ready;
  gsap.set(".draw", { strokeDashoffset: 1 });
  window.tl = build(T);
  window.tl.seek(0);
  return window.tl.duration();
};
window.seek = (t) => { window.tl.seek(t, false); };
</script>
</body>
