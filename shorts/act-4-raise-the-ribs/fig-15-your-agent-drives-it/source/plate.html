<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 15 &nbsp;·&nbsp; YOUR AGENT DRIVES IT</span>
  </div>
  <div id="boardName"><span id="bn-gateway">THE MCP GATEWAY</span><span id="bn-connect">ONE COMMAND TO CONNECT</span><span id="bn-why">WHO KEEPS WHAT</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker>
    <marker id="ahn" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e3a5f"/></marker>
  </defs>
  <!-- THE MCP GATEWAY -->
  <g id="gateway" opacity="0">
    <g id="m-agents"></g>
    <g id="m-pipe" opacity="0"><path d="M520,430 L760,430" stroke="#8a5a1f" stroke-width="4" marker-end="url(#ah)"/>
      <text x="640" y="410" text-anchor="middle" class="mono" font-size="20" fill="#8a5a1f">MCP</text></g>
    <g id="m-srv" opacity="0"><rect x="770" y="220" width="960" height="460" rx="16" fill="rgba(255,255,255,.85)" stroke="#1e3a5f" stroke-width="3"/>
      <text x="800" y="270" class="mono" font-size="21" letter-spacing="3" fill="#51607a">KEELSON SERVER</text>
      <rect x="800" y="300" width="300" height="56" rx="10" fill="#0d1429"/><text x="950" y="336" text-anchor="middle" class="mono" font-size="22" fill="#f2c66d">/api/mcp</text></g>
    <g id="m-reg" opacity="0"><rect x="1150" y="300" width="540" height="220" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
      <text x="1175" y="340" class="mono" font-size="19" letter-spacing="3" fill="#51607a">TOOL REGISTRY</text>
      <text x="1175" y="385" class="mono" font-size="21" fill="#0f1b2d">workflow_run · workflow_status</text>
      <text x="1175" y="425" class="mono" font-size="21" fill="#0f1b2d">run_list · keelson_docs · …</text>
      <text x="1175" y="475" class="mono" font-size="21" fill="#8a5a1f">beads_* · swarm_* (ribs)</text></g>
    <g id="m-cred" opacity="0"><rect x="1150" y="550" width="540" height="100" rx="12" fill="#f6ead8" stroke="#b5803a" stroke-width="2.5"/>
      <text x="1175" y="592" class="mono" font-size="20" fill="#8a5a1f">runs here, with the rib's own credentials</text>
      <text x="1175" y="628" class="mono" font-size="20" fill="#8a5a1f">secrets never cross to the agent</text></g>
  </g>
  <!-- ONE COMMAND TO CONNECT -->
  <g id="connect" opacity="0">
    <g id="c-cmd" opacity="0"><rect x="200" y="200" width="760" height="80" rx="12" fill="#0d1429"/>
      <text x="230" y="250" class="mono" font-size="26" fill="#dfe6f0"><tspan fill="#b5803a">$</tspan> keelson connect claude</text></g>
    <g id="c-rows"></g>
    <g id="c-skill" opacity="0"><rect x="1060" y="200" width="660" height="200" rx="14" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
      <text x="1090" y="245" class="mono" font-size="20" letter-spacing="3" fill="#51607a">+ A SMALL SKILL</text>
      <text x="1090" y="295" font-size="24" fill="#0f1b2d">when to reach for Keelson</text>
      <text x="1090" y="340" class="mono" font-size="19" fill="#51607a">names no rib · points at keelson_docs</text></g>
    <g id="c-undo" opacity="0"><rect x="1060" y="430" width="660" height="80" rx="12" fill="#0d1429"/>
      <text x="1090" y="480" class="mono" font-size="24" fill="#dfe6f0"><tspan fill="#b5803a">$</tspan> keelson disconnect claude</text></g>
    <g id="c-lock" opacity="0">
      <text x="200" y="640" class="mono" font-size="20" letter-spacing="3" fill="#51607a">ON LOOPBACK, OPEN BY DEFAULT · LOCK IT DOWN WITH</text>
      <rect x="200" y="665" width="390" height="56" rx="28" fill="#fff" stroke="#1e3a5f" stroke-width="2"/><text x="395" y="700" text-anchor="middle" class="mono" font-size="19" fill="#0f1b2d">exposeStateChanging: false</text>
      <rect x="620" y="665" width="240" height="56" rx="28" fill="#fff" stroke="#1e3a5f" stroke-width="2"/><text x="740" y="700" text-anchor="middle" class="mono" font-size="19" fill="#0f1b2d">requireToken</text>
      <rect x="890" y="665" width="240" height="56" rx="28" fill="#fff" stroke="#1e3a5f" stroke-width="2"/><text x="1010" y="700" text-anchor="middle" class="mono" font-size="19" fill="#0f1b2d">toolDenylist</text></g>
  </g>
  <!-- WHO KEEPS WHAT -->
  <g id="why" opacity="0">
    <g id="y-cols">
      <g id="y-a" opacity="0"><rect x="200" y="230" width="620" height="320" rx="16" fill="rgba(255,255,255,.8)" stroke="#2f6fb0" stroke-width="3"/>
        <text x="510" y="290" text-anchor="middle" class="mono" font-size="22" letter-spacing="4" fill="#2f6fb0">YOUR AGENT</text>
        <text x="510" y="380" text-anchor="middle" font-size="32" font-weight="600" fill="#0f1b2d">the conversation</text></g>
      <g id="y-b" opacity="0"><rect x="1000" y="230" width="720" height="320" rx="16" fill="rgba(246,234,216,.6)" stroke="#8a5a1f" stroke-width="3"/>
        <text x="1360" y="290" text-anchor="middle" class="mono" font-size="22" letter-spacing="4" fill="#8a5a1f">KEELSON</text>
        <text x="1360" y="360" text-anchor="middle" font-size="27" fill="#0f1b2d">workflows · gates</text>
        <text x="1360" y="410" text-anchor="middle" font-size="27" fill="#0f1b2d">the record of every run</text>
        <text x="1360" y="460" text-anchor="middle" font-size="27" fill="#0f1b2d">ribs and their credentials</text></g>
      <path id="y-arr" d="M825,390 L990,390" stroke="#8a5a1f" stroke-width="4" marker-end="url(#ah)" opacity="0"/>
    </g>
    <g id="y-recap" opacity="0"><rect x="400" y="300" width="1120" height="220" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="400" text-anchor="middle" font-size="48" font-weight="300" letter-spacing="7" fill="#1e3a5f" opacity="0">BRING YOUR AGENT</text>
      <text id="y-r2" x="960" y="470" text-anchor="middle" font-size="34" font-weight="300" letter-spacing="5" fill="#8a5a1f" opacity="0">KEELSON DOES THE KEEPING</text></g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  // THE MCP GATEWAY
  { const ag = ["Claude Code", "Copilot CLI", "Codex CLI", "Cursor"].map((n, i) => { const g = el("g", { opacity: 0 }, $("m-agents"));
      el("rect", { x: 200, y: 270 + i * 90, width: 300, height: 66, rx: 12, fill: "#fff", stroke: "#2f6fb0", "stroke-width": 2.5 }, g);
      el("text", { x: 350, y: 312 + i * 90, "text-anchor": "middle", "font-size": 24, "font-weight": 600, fill: "#0f1b2d" }, g, n); return g; });
    ag.forEach((g, i) => show(g, W("n1", "coding agent") - 0.2 + i * 0.15, 0.25));
    show($("m-pipe"), W("n1", "Model Context Protocol") - 0.2);
    show($("m-srv"), W("n1", "same server") - 0.2);
    show($("m-reg"), W("n1", "workflow tools") - 0.2);
    show($("m-cred"), W("n1", "runs inside") - 0.2);
  }
  // ONE COMMAND TO CONNECT
  { show($("c-cmd"), W("n5", "Keelson connect") - 0.2);
    [["claude", "user-scope MCP entry · HTTP"], ["copilot", "~/.copilot/mcp-config.json · HTTP"], ["codex", "~/.codex/config.toml · stdio bridge"]].forEach(([a, b], i) => { const g = el("g", { opacity: 0 }, $("c-rows"));
      el("text", { x: 230, y: 340 + i * 60, class: "mono", "font-size": 22, fill: "#2f6fb0" }, g, a);
      el("text", { x: 380, y: 340 + i * 60, class: "mono", "font-size": 20, fill: "#51607a" }, g, b);
      show(g, W("n5", "registers the endpoint") - 0.2 + i * 0.25, 0.25); });
    show($("c-skill"), W("n5", "small skill") - 0.2);
    show($("c-undo"), W("n5", "Disconnect") - 0.2);
    show($("c-lock"), W("n5", "On loopback") - 0.2);
  }
  // WHO KEEPS WHAT
  { show($("y-a"), W("n8", "your agent") - 0.1);
    show($("y-arr"), W("n8", "Keelson keeps") - 0.3);
    show($("y-b"), W("n8", "Keelson keeps") - 0.1);
    const b = W("n9", "Bring your");
    tl.to($("y-cols"), { opacity: 0.15, duration: 0.5 }, b - 0.5);
    show($("y-recap"), b - 0.5, 0.4); show($("y-r1"), b - 0.1); show($("y-r2"), W("n9", "Keelson does") - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
