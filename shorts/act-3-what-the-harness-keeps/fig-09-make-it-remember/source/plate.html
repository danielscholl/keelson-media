<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 09 &nbsp;·&nbsp; MAKE IT REMEMBER</span>
  </div>
  <div id="boardName"><span id="bn-tiers">TWO TIERS, ONE RULE</span><span id="bn-gate">EVIDENCE FIRST</span><span id="bn-why">HOW RECALL WORKS</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker>
    <marker id="ahn" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e3a5f"/></marker>
    <marker id="ahg" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f8f5b"/></marker>
    <g id="person"><circle cx="0" cy="-34" r="22" fill="none" stroke="#1e3a5f" stroke-width="3"/><path d="M-38,36 C-38,0 38,0 38,36" fill="none" stroke="#1e3a5f" stroke-width="3"/></g>
  </defs>

  <!-- TWO TIERS, ONE RULE -->
  <g id="tiers" opacity="0">
    <g id="t-cold" opacity="0">
      <rect x="730" y="190" width="460" height="80" rx="12" fill="#fff" stroke="#51607a" stroke-width="2.5" stroke-dasharray="8 6"/>
      <text x="960" y="240" text-anchor="middle" class="mono" font-size="24" fill="#51607a">new session · knows nothing</text>
    </g>
    <g id="t-nb" opacity="0">
      <rect x="200" y="330" width="620" height="260" rx="16" fill="rgba(255,255,255,.8)" stroke="#1e3a5f" stroke-width="3"/>
      <text x="230" y="380" class="mono" font-size="22" letter-spacing="4" fill="#1e3a5f">NOTEBOOK</text>
      <text x="230" y="440" font-size="30" font-weight="600" fill="#0f1b2d">what you tell it</text>
      <text x="230" y="490" class="mono" font-size="21" fill="#51607a">"tide times stay in UTC"</text>
      <text x="230" y="545" class="mono" font-size="19" fill="#2f8f5b">always present · you edit it</text>
    </g>
    <g id="t-mem" opacity="0">
      <rect x="1100" y="330" width="620" height="260" rx="16" fill="rgba(246,234,216,.6)" stroke="#8a5a1f" stroke-width="3"/>
      <text x="1130" y="380" class="mono" font-size="22" letter-spacing="4" fill="#8a5a1f">MEMORY</text>
      <text x="1130" y="440" font-size="30" font-weight="600" fill="#0f1b2d">what it learns</text>
      <text x="1130" y="490" class="mono" font-size="21" fill="#51607a">lessons from runs you weren't watching</text>
      <text x="1130" y="545" class="mono" font-size="19" fill="#8a5a1f">typed rows · reviewed by you</text>
    </g>
    <g id="t-rule" opacity="0">
      <rect x="560" y="650" width="260" height="70" rx="35" fill="#fff" stroke="#8a5a1f" stroke-width="3"/>
      <text x="690" y="694" text-anchor="middle" class="mono" font-size="24" font-weight="700" fill="#8a5a1f">written</text>
      <rect x="1100" y="650" width="260" height="70" rx="35" fill="#e8f3ec" stroke="#2f8f5b" stroke-width="3"/>
      <text x="1230" y="694" text-anchor="middle" class="mono" font-size="24" font-weight="700" fill="#2f8f5b">trusted</text>
      <line x1="825" y1="685" x2="905" y2="685" stroke="#51607a" stroke-width="3" stroke-dasharray="6 6"/>
      <line x1="1015" y1="685" x2="1095" y2="685" stroke="#51607a" stroke-width="3" stroke-dasharray="6 6"/>
      <use href="#person" x="960" y="690"/>
      <text x="960" y="770" text-anchor="middle" class="mono" font-size="19" fill="#1e3a5f">only you connect them</text>
    </g>
  </g>

  <!-- EVIDENCE FIRST -->
  <g id="gate" opacity="0">
    <g id="g-draft" opacity="0">
      <rect x="140" y="340" width="300" height="190" rx="14" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
      <text x="165" y="385" class="mono" font-size="20" letter-spacing="3" fill="#51607a">DRAFT · lesson</text>
      <text x="165" y="430" font-size="21" fill="#0f1b2d">drifts ~11 min early</text>
      <text x="165" y="460" font-size="21" fill="#0f1b2d">each lunar month</text>
      <text x="165" y="505" class="mono" font-size="19" fill="#2f6fb0">provenance: generated</text>
    </g>
    <g id="g-guard" opacity="0">
      <path d="M470,435 L540,435" stroke="#1e3a5f" stroke-width="3" marker-end="url(#ahn)"/>
      <rect x="550" y="330" width="240" height="210" rx="14" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="10 7"/>
      <text x="670" y="370" text-anchor="middle" class="mono" font-size="19" letter-spacing="3" fill="#51607a">GUARDRAILS</text>
      <text x="580" y="420" class="mono" font-size="20" fill="#b8433a">✗ secrets</text>
      <text x="580" y="460" class="mono" font-size="20" fill="#b8433a">✗ duplicates</text>
      <text x="580" y="500" class="mono" font-size="20" fill="#b8433a">✗ oversize</text>
    </g>
    <g id="g-pend" opacity="0">
      <path d="M795,435 L860,435" stroke="#1e3a5f" stroke-width="3" marker-end="url(#ahn)"/>
      <rect x="870" y="395" width="190" height="80" rx="40" fill="#f6ead8" stroke="#b5803a" stroke-width="3"/>
      <text x="965" y="443" text-anchor="middle" class="mono" font-size="25" font-weight="700" fill="#8a5a1f">pending</text>
      <text x="965" y="510" text-anchor="middle" class="mono" font-size="18" fill="#8a5a1f">can't reach the agent</text>
    </g>
    <g id="g-person" opacity="0"><use href="#person" x="1150" y="440"/><path d="M1065,435 L1100,435" stroke="#1e3a5f" stroke-width="3"/></g>
    <g id="g-out"></g>
    <g id="g-journal" opacity="0">
      <rect x="800" y="640" width="330" height="70" rx="10" fill="#0d1429"/>
      <text x="825" y="684" class="mono" font-size="21" fill="#dfe6f0"><tspan fill="#b5803a">▤</tspan> audit journal · every decision</text>
    </g>
  </g>

  <!-- HOW RECALL WORKS -->
  <g id="why" opacity="0">
    <g id="r-cols">
      <g id="r-1" opacity="0"><rect x="180" y="250" width="440" height="260" rx="14" fill="rgba(255,255,255,.8)" stroke="#1e3a5f" stroke-width="3"/>
        <text x="400" y="320" text-anchor="middle" class="mono" font-size="22" letter-spacing="4" fill="#51607a">SCOPED</text>
        <text x="400" y="390" text-anchor="middle" font-size="30" font-weight="600" fill="#0f1b2d">to this project</text>
        <text x="400" y="440" text-anchor="middle" class="mono" font-size="20" fill="#8a5a1f">harbor only</text></g>
      <g id="r-2" opacity="0"><rect x="740" y="250" width="440" height="260" rx="14" fill="rgba(255,255,255,.8)" stroke="#1e3a5f" stroke-width="3"/>
        <text x="960" y="320" text-anchor="middle" class="mono" font-size="22" letter-spacing="4" fill="#51607a">RANKED</text>
        <text x="960" y="390" text-anchor="middle" font-size="30" font-weight="600" fill="#0f1b2d">by relevance</text>
        <text x="960" y="440" text-anchor="middle" class="mono" font-size="20" fill="#8a5a1f">confirmed rows only</text></g>
      <g id="r-3" opacity="0"><rect x="1300" y="250" width="440" height="260" rx="14" fill="rgba(255,255,255,.8)" stroke="#1e3a5f" stroke-width="3"/>
        <text x="1520" y="320" text-anchor="middle" class="mono" font-size="22" letter-spacing="4" fill="#51607a">FADES</text>
        <path d="M1350,350 C1420,350 1450,410 1520,425 C1590,440 1640,446 1700,448" fill="none" stroke="#2f8f5b" stroke-width="4"/>
        <text x="1520" y="490" text-anchor="middle" class="mono" font-size="19" fill="#0f1b2d">30-day half-life</text></g>
      <g id="r-warm" opacity="0"><text x="960" y="620" text-anchor="middle" font-size="30" fill="#0f1b2d">the next session starts warm, on what you checked</text></g>
    </g>
    <g id="r-recap" opacity="0">
      <rect x="400" y="290" width="1120" height="240" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="r-r1" x="960" y="395" text-anchor="middle" font-size="52" font-weight="300" letter-spacing="8" fill="#1e3a5f" opacity="0">REMEMBERED ISN'T BELIEVED</text>
      <text id="r-r2" x="960" y="475" text-anchor="middle" font-size="40" font-weight="300" letter-spacing="7" fill="#8a5a1f" opacity="0">NOT UNTIL YOU SAY SO</text>
    </g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  // TWO TIERS, ONE RULE
  { const s = T.tiers.s;
    show($("t-cold"), s + 0.2, 0.4);
    show($("t-nb"), W("n1", "The notebook") - 0.2);
    show($("t-mem"), W("n1", "Memory is") - 0.2);
    show($("t-rule"), W("n1", "writing a memory") - 0.2);
  }

  // EVIDENCE FIRST
  { const s = T.gate.s, out = $("g-out");
    show($("g-draft"), s + 0.2, 0.4);
    show($("g-guard"), W("n5", "guardrails") - 0.2);
    show($("g-pend"), W("n5", "lands pending") - 0.2);
    show($("g-person"), W("n5", "Only a person") - 0.2);
    const outs = [["confirm", "instruction grade", "#2f8f5b", 330, "Confirm makes"], ["evidence-only", "searchable, never injected", "#8a5a1f", 450, "evidence only"], ["reject", "discarded", "#b8433a", 570, "reject discards"]];
    outs.forEach(([a, b, col, y, ph]) => { const g = el("g", { opacity: 0 }, out);
      el("path", { d: `M1195,430 C1250,430 1260,${y} 1310,${y}`, stroke: col, "stroke-width": 3, fill: "none" }, g);
      el("rect", { x: 1315, y: y - 34, width: 200, height: 60, rx: 30, fill: "#fff", stroke: col, "stroke-width": 2.5 }, g);
      el("text", { x: 1415, y: y + 4, "text-anchor": "middle", class: "mono", "font-size": 20, "font-weight": 700, fill: col }, g, a);
      el("text", { x: 1530, y: y + 4, class: "mono", "font-size": 18, fill: "#51607a" }, g, b);
      show(g, W("n5", ph) - 0.15, 0.3); });
    show($("g-journal"), W("n5", "audit journal") - 0.3);
  }

  // HOW RECALL WORKS
  { show($("r-1"), W("n8", "scoped to") - 0.1);
    show($("r-2"), W("n8", "ranked by") - 0.1);
    show($("r-3"), W("n8", "fades") - 0.1);
    show($("r-warm"), W("n8", "starts warm") - 0.1);
    const rb = W("n9", "Remembered");
    tl.to($("r-cols"), { opacity: 0.15, duration: 0.5 }, rb - 0.5);
    show($("r-recap"), rb - 0.5, 0.4);
    show($("r-r1"), rb - 0.1); show($("r-r2"), W("n9", "Not until") - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
