<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 03 &nbsp;·&nbsp; A PLACE TO WORK</span>
  </div>
  <div id="boardName"><span id="bn-pointer">WHAT A PROJECT IS</span><span id="bn-notebook">THE NOTEBOOK</span><span id="bn-why">WHY BIND WORK</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker>
    <marker id="ahn" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e3a5f"/></marker>
    <g id="gl-page">
      <path d="M0,0 L190,0 L230,40 L230,270 L0,270 Z" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
      <path d="M190,0 L190,40 L230,40" fill="none" stroke="#1e3a5f" stroke-width="2"/>
      <text x="20" y="74" class="mono" font-size="19" fill="#1e3a5f" font-weight="700">## Conventions</text>
      <rect x="20" y="96" width="180" height="10" rx="3" fill="#c8d2e0"/>
      <rect x="20" y="118" width="150" height="10" rx="3" fill="#c8d2e0"/>
      <rect x="20" y="150" width="170" height="10" rx="3" fill="#c8d2e0"/>
      <rect x="20" y="172" width="120" height="10" rx="3" fill="#c8d2e0"/>
    </g>
  </defs>

  <!-- WHAT A PROJECT IS -->
  <g id="pointer" opacity="0">
    <g id="p-folder" opacity="0">
      <path d="M170,250 L330,250 L360,288 L620,288 L620,720 L150,720 L150,270 Q150,250 170,250 Z" fill="rgba(255,255,255,.75)" stroke="#1e3a5f" stroke-width="3"/>
      <text x="186" y="352" class="mono" font-size="34" font-weight="700" fill="#1e3a5f">harbor/</text>
      <text x="200" y="420" class="mono" font-size="25" fill="#0f1b2d">package.json</text>
      <text x="200" y="470" class="mono" font-size="25" fill="#0f1b2d">README.md</text>
      <text x="200" y="520" class="mono" font-size="25" fill="#0f1b2d">src/tides.ts</text>
      <text x="200" y="570" class="mono" font-size="25" fill="#0f1b2d">test/</text>
      <text x="385" y="680" text-anchor="middle" class="mono" font-size="19" letter-spacing="3" fill="#51607a">A REPO ON DISK</text>
    </g>
    <path id="p-a0" class="draw" pathLength="1" d="M630,480 L760,480" stroke="#8a5a1f" stroke-width="3.5" fill="none" marker-end="url(#ah)" opacity="0"/>
    <g id="p-tag" opacity="0">
      <rect x="780" y="380" width="460" height="200" rx="14" fill="#fff" stroke="#1e3a5f" stroke-width="3.5"/>
      <text x="808" y="426" class="mono" font-size="20" letter-spacing="4" fill="#51607a">PROJECT</text>
      <g id="p-name" opacity="0"><text x="808" y="482" class="mono" font-size="22" fill="#51607a">name</text><text x="908" y="482" class="mono" font-size="28" font-weight="700" fill="#0f1b2d">harbor</text></g>
      <g id="p-root" opacity="0"><text x="808" y="536" class="mono" font-size="22" fill="#51607a">root</text><text x="908" y="536" class="mono" font-size="22" fill="#8a5a1f">…/keelson-demo/harbor</text></g>
    </g>
    <g stroke="#1e3a5f" stroke-width="2.5" fill="none">
      <path id="p-l1" class="draw" pathLength="1" d="M1242,420 C1320,420 1330,240 1420,240" marker-end="url(#ahn)" opacity="0"/>
      <path id="p-l2" class="draw" pathLength="1" d="M1242,480 L1420,480" marker-end="url(#ahn)" opacity="0"/>
      <path id="p-l3" class="draw" pathLength="1" d="M1242,540 C1320,540 1330,720 1420,720" marker-end="url(#ahn)" opacity="0"/>
    </g>
    <g id="p-chats" opacity="0">
      <rect x="1430" y="180" width="300" height="120" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
      <rect x="1450" y="200" width="150" height="30" rx="8" fill="#e8eef8" stroke="#2f6fb0" stroke-width="1.5"/>
      <rect x="1560" y="246" width="150" height="30" rx="8" fill="#dfe6f0"/>
      <text x="1580" y="336" text-anchor="middle" class="mono" font-size="21" letter-spacing="3" fill="#1e3a5f">CHATS</text>
    </g>
    <g id="p-runs" opacity="0">
      <rect x="1430" y="420" width="300" height="120" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
      <circle cx="1480" cy="480" r="14" fill="#2f8f5b"/><circle cx="1580" cy="450" r="14" fill="#2f8f5b"/><circle cx="1580" cy="510" r="14" fill="#2f8f5b"/><circle cx="1680" cy="480" r="14" fill="#b5803a"/>
      <path d="M1494,476 L1566,452 M1494,484 L1566,508 M1594,452 L1666,476 M1594,508 L1666,484" stroke="#51607a" stroke-width="2"/>
      <text x="1580" y="576" text-anchor="middle" class="mono" font-size="21" letter-spacing="3" fill="#1e3a5f">WORKFLOW RUNS</text>
    </g>
    <g id="p-nb" opacity="0">
      <use href="#gl-page" transform="translate(1465,640) scale(0.5)"/>
      <text x="1640" y="690" class="mono" font-size="21" letter-spacing="3" fill="#1e3a5f">NOTEBOOK</text>
    </g>
    <g id="p-once" opacity="0">
      <rect x="850" y="620" width="320" height="64" rx="32" fill="#fff" stroke="#b5803a" stroke-width="3"/>
      <text x="1010" y="662" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#8a5a1f">BIND IT ONCE</text>
    </g>
  </g>

  <!-- THE NOTEBOOK -->
  <g id="notebook" opacity="0">
    <g id="n-page" opacity="0">
      <use href="#gl-page" transform="translate(170,190) scale(1.35)"/>
      <text x="325" y="590" text-anchor="middle" class="mono" font-size="20" letter-spacing="3" fill="#51607a">ONE MARKDOWN DOC</text>
      <text x="325" y="620" text-anchor="middle" class="mono" font-size="20" letter-spacing="3" fill="#51607a">PER PROJECT</text>
    </g>
    <g id="n-turns"></g>
    <path id="n-feed" class="draw" pathLength="1" d="M490,360 C620,360 640,300 760,300" stroke="#8a5a1f" stroke-width="3.5" fill="none" marker-end="url(#ah)" opacity="0"/>
    <g id="n-tool" opacity="0">
      <path id="n-toolLine" d="M760,560 C640,560 600,520 495,500" stroke="#2f6fb0" stroke-width="3" fill="none" marker-end="url(#ahn)"/>
      <rect x="560" y="566" width="180" height="40" rx="20" fill="#fff" stroke="#2f6fb0" stroke-width="2"/>
      <text x="650" y="593" text-anchor="middle" class="mono" font-size="19" fill="#2f6fb0">note_project</text>
    </g>
    <g id="n-you" opacity="0">
      <rect x="540" y="150" width="160" height="44" rx="22" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
      <text x="620" y="179" text-anchor="middle" class="mono" font-size="20" fill="#1e3a5f">you edit</text>
      <path d="M540,180 C510,180 500,200 486,224" stroke="#1e3a5f" stroke-width="2.5" fill="none" marker-end="url(#ahn)"/>
    </g>
    <g id="n-stays" opacity="0">
      <rect x="140" y="170" width="370" height="400" rx="16" fill="none" stroke="#2f8f5b" stroke-width="4"/>
      <text x="325" y="740" text-anchor="middle" class="mono" font-size="24" font-weight="700" letter-spacing="3" fill="#2f8f5b">THE NOTEBOOK STAYS</text>
    </g>
  </g>

  <!-- WHY BIND WORK -->
  <g id="why" opacity="0">
    <g id="w-left">
      <g id="w-tree" opacity="0">
        <rect x="170" y="170" width="700" height="420" rx="14" fill="rgba(255,255,255,.75)" stroke="#1e3a5f" stroke-width="3"/>
        <text x="198" y="214" class="mono" font-size="20" letter-spacing="4" fill="#51607a">YOUR WORKING TREE</text>
        <text x="210" y="290" class="mono" font-size="25" fill="#0f1b2d">src/tides.ts</text>
        <text x="210" y="350" class="mono" font-size="25" fill="#0f1b2d">test/tides.test.ts</text>
        <text x="210" y="410" class="mono" font-size="25" fill="#0f1b2d">README.md</text>
      </g>
      <g id="w-chat" opacity="0">
        <rect x="560" y="250" width="270" height="80" rx="12" fill="#fff" stroke="#2f6fb0" stroke-width="2.5"/>
        <text x="695" y="300" text-anchor="middle" class="mono" font-size="22" fill="#2f6fb0">chat edit</text>
        <path d="M560,290 L460,290" stroke="#2f6fb0" stroke-width="3" marker-end="url(#ahn)"/>
        <circle cx="440" cy="281" r="9" fill="#b5803a"/>
        <text x="520" y="540" text-anchor="middle" class="mono" font-size="22" font-weight="700" letter-spacing="3" fill="#8a5a1f">LANDS IN PLACE</text>
      </g>
      <g id="w-wt" opacity="0">
        <rect x="170" y="640" width="700" height="120" rx="14" fill="none" stroke="#51607a" stroke-width="2.5" stroke-dasharray="10 8"/>
        <text x="198" y="690" class="mono" font-size="20" letter-spacing="3" fill="#51607a">WORKFLOW RUN · OWN WORKTREE</text>
        <text x="198" y="730" class="mono" font-size="20" fill="#51607a">keelson/&lt;workflow&gt;/&lt;run&gt;  · later</text>
      </g>
    </g>
    <g id="w-right" opacity="0">
      <use href="#gl-page" transform="translate(1230,180) scale(1.0)"/>
      <text x="1345" y="490" text-anchor="middle" class="mono" font-size="20" letter-spacing="3" fill="#1e3a5f">harbor</text>
      <g id="w-convs" stroke="#1e3a5f" stroke-width="2.5" fill="none"></g>
    </g>
    <g id="w-recap" opacity="0">
      <rect x="400" y="230" width="1120" height="400" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="w-r1" x="960" y="340" text-anchor="middle" font-size="54" font-weight="300" letter-spacing="9" fill="#1e3a5f" opacity="0">ONE NAME</text>
      <text id="w-r2" x="960" y="430" text-anchor="middle" font-size="54" font-weight="300" letter-spacing="9" fill="#1e3a5f" opacity="0">ONE ROOT</text>
      <text id="w-r3" x="960" y="520" text-anchor="middle" font-size="54" font-weight="300" letter-spacing="9" fill="#1e3a5f" opacity="0">ONE NOTEBOOK</text>
      <text id="w-r4" x="960" y="594" text-anchor="middle" font-size="30" letter-spacing="4" fill="#8a5a1f" opacity="0">A PLACE TO WORK</text>
    </g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  // WHAT A PROJECT IS
  { const s = T.pointer.s;
    show($("p-folder"), W("n1", "somewhere on disk") - 0.2, 0.5);
    const pj = W("n1", "a project");
    draw($("p-a0"), pj - 0.3, 0.5); show($("p-tag"), pj);
    show($("p-name"), W("n1", "a name") - 0.1); show($("p-root"), W("n1", "root path") - 0.1);
    draw($("p-l1"), W("n1", "Chats") - 0.1, 0.5); show($("p-chats"), W("n1", "Chats") + 0.2);
    draw($("p-l2"), W("n1", "workflow runs") - 0.1, 0.5); show($("p-runs"), W("n1", "workflow runs") + 0.2);
    draw($("p-l3"), W("n1", "a notebook") - 0.1, 0.5); show($("p-nb"), W("n1", "a notebook") + 0.2);
    show($("p-once"), W("n1", "once") - 0.1, 0.3);
  }

  // THE NOTEBOOK
  { const s = T.notebook.s, turns = $("n-turns");
    show($("n-page"), s + 0.2, 0.5);
    const bt = W("n5", "Before every");
    const tg = [];
    for (let i = 0; i < 3; i++) {
      const x = 780 + i * 370, g = el("g", { opacity: 0 }, turns);
      el("rect", { x, y: 200, width: 330, height: 330, rx: 12, fill: "#fff", stroke: "#1e3a5f", "stroke-width": 2.5 }, g);
      el("text", { x: x + 20, y: 238, class: "mono", "font-size": 19, "letter-spacing": 3, fill: "#51607a" }, g, `TURN ${i + 1}`);
      const nb = el("rect", { x: x + 20, y: 260, width: 290, height: 70, rx: 8, fill: "#f6ead8", stroke: "#b5803a", "stroke-width": 2 }, g);
      el("text", { x: x + 40, y: 303, class: "mono", "font-size": 21, fill: "#8a5a1f" }, g, "notebook");
      el("rect", { x: x + 20, y: 346, width: 290, height: 60, rx: 8, fill: "#e8eef8" }, g);
      el("text", { x: x + 40, y: 384, class: "mono", "font-size": 19, fill: "#51607a" }, g, "instructions");
      el("rect", { x: x + 20, y: 422, width: 290, height: 86, rx: 8, fill: "#dfe6f0" }, g);
      el("text", { x: x + 40, y: 470, class: "mono", "font-size": 19, fill: "#51607a" }, g, "your message");
      tg.push(g);
      show(g, bt + i * 0.45, 0.35);
    }
    draw($("n-feed"), W("n5", "puts it") - 0.2, 0.6);
    show($("n-tool"), W("n5", "note tool") - 0.3);
    show($("n-you"), W("n5", "edit it too") - 0.3);
    const ce = W("n5", "A conversation ends");
    tl.to(tg, { opacity: 0.12, duration: 0.6 }, ce);
    tl.to([$("n-tool"), $("n-you"), $("n-feed")], { opacity: 0.2, duration: 0.6 }, ce);
    show($("n-stays"), W("n5", "The notebook stays") - 0.1, 0.4);
  }

  // WHY BIND WORK
  { show($("w-tree"), W("n9", "in place") - 0.3);
    show($("w-chat"), W("n9", "chat edits") - 0.2);
    show($("w-wt"), W("n9", "Workflow runs") - 0.1);
    const ctx = W("n9", "the context");
    show($("w-right"), ctx - 0.2);
    const cv = $("w-convs");
    [230, 330, 430].forEach((y, i) => {
      const g = el("g", { opacity: 0 }, cv);
      el("path", { d: `M1700,${y} L1475,${y}`, "marker-end": "url(#ahn)" }, g);
      el("rect", { x: 1700, y: y - 30, width: 130, height: 60, rx: 10, fill: "#fff" }, g);
      el("text", { x: 1765, y: y + 7, "text-anchor": "middle", class: "mono", "font-size": 18, fill: "#1e3a5f", stroke: "none" }, g, `chat ${i + 1}`);
      show(g, W("n9", "not to one") - 0.6 + i * 0.25, 0.3);
    });
    const on = W("n10", "One name");
    tl.to([$("w-left"), $("w-right")], { opacity: 0.15, duration: 0.6 }, on - 0.4);
    show($("w-recap"), on - 0.4, 0.5);
    show($("w-r1"), on - 0.1); show($("w-r2"), W("n10", "one root") - 0.1); show($("w-r3"), W("n10", "one notebook") - 0.1);
    show($("w-r4"), W("n10", "A place to work") - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
