<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 08 &nbsp;·&nbsp; ISSUE TO DRAFT PR</span>
  </div>
  <div id="boardName"><span id="bn-seam">THE GATE ON THE SEAM</span><span id="bn-worktree">ITS OWN WORKTREE</span><span id="bn-why">A DRAFT, NOT A SURPRISE</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker>
    <marker id="ahn" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e3a5f"/></marker>
  </defs>

  <!-- THE GATE ON THE SEAM -->
  <g id="seam" opacity="0">
    <g id="s-issue" opacity="0">
      <rect x="140" y="370" width="210" height="130" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
      <circle cx="180" cy="410" r="12" fill="none" stroke="#2f8f5b" stroke-width="3"/><circle cx="180" cy="410" r="3" fill="#2f8f5b"/>
      <text x="205" y="418" class="mono" font-size="22" fill="#0f1b2d">issue #1</text>
      <text x="165" y="465" font-size="20" fill="#51607a">Print more than</text><text x="165" y="490" font-size="20" fill="#51607a">one day of tides</text>
    </g>
    <g id="s-read" opacity="0">
      <rect x="390" y="300" width="560" height="270" rx="16" fill="rgba(232,238,248,.7)" stroke="#2f6fb0" stroke-width="2.5" stroke-dasharray="10 7"/>
      <text x="670" y="345" text-anchor="middle" class="mono" font-size="21" letter-spacing="4" fill="#2f6fb0">READS AND THINKS</text>
    </g>
    <g id="s-rnodes"></g>
    <g id="s-gate" opacity="0">
      <rect x="985" y="330" width="130" height="210" rx="14" fill="#f6ead8" stroke="#b5803a" stroke-width="3.5"/>
      <rect x="1018" y="380" width="22" height="70" rx="5" fill="#1e3a5f"/><rect x="1060" y="380" width="22" height="70" rx="5" fill="#1e3a5f"/>
      <text x="1050" y="500" text-anchor="middle" class="mono" font-size="20" fill="#8a5a1f">approve</text>
      <line x1="1050" y1="200" x2="1050" y2="680" stroke="#b5803a" stroke-width="2" stroke-dasharray="6 8"/>
      <text x="1050" y="720" text-anchor="middle" class="mono" font-size="20" letter-spacing="3" fill="#8a5a1f">THE SEAM</text>
    </g>
    <g id="s-write" opacity="0">
      <rect x="1150" y="300" width="640" height="270" rx="16" fill="rgba(246,234,216,.6)" stroke="#8a5a1f" stroke-width="2.5" stroke-dasharray="10 7"/>
      <text x="1470" y="345" text-anchor="middle" class="mono" font-size="21" letter-spacing="4" fill="#8a5a1f">WRITES</text>
    </g>
    <g id="s-wnodes"></g>
  </g>

  <!-- ITS OWN WORKTREE -->
  <g id="worktree" opacity="0">
    <g id="w-main" opacity="0">
      <rect x="150" y="200" width="620" height="420" rx="16" fill="rgba(255,255,255,.8)" stroke="#1e3a5f" stroke-width="3"/>
      <text x="180" y="248" class="mono" font-size="21" letter-spacing="4" fill="#51607a">YOUR CHECKOUT</text>
      <text x="180" y="300" class="mono" font-size="26" fill="#0f1b2d">harbor/</text>
      <text x="200" y="350" class="mono" font-size="23" fill="#2f8f5b">main · clean</text>
      <text x="200" y="400" class="mono" font-size="22" fill="#51607a">src/tides.ts</text>
      <text x="200" y="440" class="mono" font-size="22" fill="#51607a">test/tides.test.ts</text>
      <text id="w-untouched" x="460" y="570" text-anchor="middle" class="mono" font-size="22" font-weight="700" letter-spacing="3" fill="#2f8f5b" opacity="0">NEVER TOUCHED</text>
    </g>
    <path id="w-arrow" class="draw" pathLength="1" d="M775,410 C880,410 900,410 990,410" stroke="#8a5a1f" stroke-width="3.5" fill="none" marker-end="url(#ah)" opacity="0"/>
    <g id="w-tree" opacity="0">
      <rect x="1000" y="200" width="780" height="420" rx="16" fill="rgba(246,234,216,.55)" stroke="#8a5a1f" stroke-width="3" stroke-dasharray="12 8"/>
      <text x="1030" y="248" class="mono" font-size="21" letter-spacing="4" fill="#8a5a1f">ITS OWN WORKTREE</text>
      <text x="1030" y="300" class="mono" font-size="23" fill="#0f1b2d">.worktrees/38ca9b02/</text>
    </g>
    <g id="w-branch" opacity="0"><text x="1050" y="350" class="mono" font-size="23" fill="#8a5a1f">keelson/fix-issue/38ca9b02</text></g>
    <g id="w-steps"></g>
  </g>

  <!-- A DRAFT, NOT A SURPRISE -->
  <g id="why" opacity="0">
    <g id="y-cols"></g>
    <g id="y-recap" opacity="0">
      <rect x="400" y="290" width="1120" height="240" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="395" text-anchor="middle" font-size="54" font-weight="300" letter-spacing="9" fill="#1e3a5f" opacity="0">READ · APPROVE</text>
      <text id="y-r2" x="960" y="475" text-anchor="middle" font-size="40" font-weight="300" letter-spacing="7" fill="#8a5a1f" opacity="0">THEN WRITE, SOMEWHERE ELSE</text>
    </g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  const pill = (parent, x, y, w, label, col) => { const g = el("g", { opacity: 0 }, parent);
    el("rect", { x, y, width: w, height: 56, rx: 10, fill: "#fff", stroke: col, "stroke-width": 2.5 }, g);
    el("text", { x: x + w / 2, y: y + 36, "text-anchor": "middle", class: "mono", "font-size": 21, fill: "#0f1b2d" }, g, label); return g; };

  // THE GATE ON THE SEAM
  { const s = T.seam.s;
    show($("s-issue"), s + 0.3, 0.4);
    tl.set([$("s-read"), $("s-write")], { opacity: 0.25 }, s + 0.6);
    show($("s-read"), W("n1", "reads and thinks") - 0.4);
    const rn = ["fetch", "classify", "plan"].map((l, i) => pill($("s-rnodes"), 420 + i * 175, 420, 160, l, "#2f6fb0"));
    rn.forEach((g, i) => show(g, W("n1", "reads and thinks") - 0.2 + i * 0.2, 0.25));
    show($("s-write"), W("n1", "it writes") - 0.3);
    const wl = [["branch", 1166, 400], ["commits", 1319, 400], ["push", 1472, 400], ["draft PR", 1625, 400]];
    const ww = [[W("n1", "a branch"), 0], [W("n1", "commits"), 1], [W("n1", "a push"), 2], [W("n1", "a pull request"), 3]];
    const wg = wl.map(([l, x, y]) => pill($("s-wnodes"), x, y + 20, 140, l, "#8a5a1f"));
    ww.forEach(([t, i]) => show(wg[i], t - 0.1, 0.25));
    show($("s-gate"), W("n1", "The gate sits") - 0.2, 0.4);
  }

  // ITS OWN WORKTREE
  { const s = T.worktree.s;
    show($("w-main"), s + 0.2, 0.4);
    draw($("w-arrow"), W("n5", "its own git worktree") - 0.4, 0.5);
    show($("w-tree"), W("n5", "its own git worktree") - 0.1);
    show($("w-branch"), W("n5", "on a branch") - 0.1);
    const st = $("w-steps");
    const steps = [["implement", "implements", "#2f6fb0"], ["checks", "own checks", "#8a5a1f"], ["fix", "fixes what fails", "#2f6fb0"], ["hard gate", "hard gate", "#b8433a"]];
    steps.forEach(([l, ph, col], i) => { const g = pill(st, 1030 + i * 185, 420, 170, l, col); show(g, W("n5", ph) - 0.15, 0.25);
      if (i) { const a = el("path", { d: `M${1030 + i * 185 - 14},448 L${1030 + i * 185 - 2},448`, stroke: "#1e3a5f", "stroke-width": 2.5, opacity: 0 }, st); show(a, W("n5", ph) - 0.15, 0.25); } });
    const pr = pill(st, 1300, 520, 200, "draft PR", "#2f8f5b"); show(pr, W("n5", "refuses to open") + 0.2, 0.3);
    show($("w-untouched"), W("n5", "Every node runs there") - 0.1, 0.3);
  }

  // A DRAFT, NOT A SURPRISE
  { const cols = $("y-cols");
    const items = [["can't write", "before you approve the plan", "write before"], ["can't touch", "the checkout you're working in", "touch your checkout"], ["can't open a PR", "over failing checks", "open a PR"]];
    const gs = items.map(([a, b, ph], i) => { const x = 170 + i * 540, g = el("g", { opacity: 0 }, cols);
      el("rect", { x, y: 230, width: 500, height: 300, rx: 16, fill: "rgba(255,255,255,.8)", stroke: "#1e3a5f", "stroke-width": 3 }, g);
      el("rect", { x: x + 220, y: 280, width: 60, height: 50, rx: 8, fill: "none", stroke: "#8a5a1f", "stroke-width": 4 }, g);
      el("path", { d: `M${x + 232},280 L${x + 232},262 A18,18 0 0 1 ${x + 268},262 L${x + 268},280`, fill: "none", stroke: "#8a5a1f", "stroke-width": 4 }, g);
      el("text", { x: x + 250, y: 410, "text-anchor": "middle", "font-size": 34, "font-weight": 600, fill: "#0f1b2d" }, g, a);
      el("text", { x: x + 250, y: 460, "text-anchor": "middle", "font-size": 23, fill: "#51607a" }, g, b);
      show(g, W("n9", ph) - 0.3, 0.3); return g; });
    const r = W("n10", "Read");
    tl.to(cols, { opacity: 0.15, duration: 0.5 }, r - 0.5);
    show($("y-recap"), r - 0.5, 0.4);
    show($("y-r1"), r - 0.1); show($("y-r2"), W("n10", "then write") - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
