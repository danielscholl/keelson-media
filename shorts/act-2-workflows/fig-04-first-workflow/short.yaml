fig: "04"
slug: first-workflow
title: First workflow
act: II
problem: What does it mean to take the control flow away from the agent, and what does a run leave behind?
docs: [tutorials/run-a-workflow, concepts/workflows]
voice: en-US-Harper:MAI-Voice-2.1
bookends: { open: lay-the-keel, close: raise-the-ribs }
crossfade: 0.5

plate:
  html: source/plate.html
  out: raw/plate.mp4
  boards:
    - { id: halves, lines: [n1], lead: 0.5, tail: 1.0 }
    - { id: families, lines: [n4], lead: 0.4, tail: 1.2 }
    - { id: record, lines: [n8, n9], lead: 0.4, gap: 0.6, tail: 1.6 }

scenes:
  - id: b-halves
    source: raw/plate.mp4
    marks: source/plate-marks.json
    frame: full
    trim: [halves, halves.end]
    xfade: 0.8
  - id: cli
    source: raw/cli.mp4
    frame: viewport
    label: TERMINAL
    marks: { enter: 3.1, output: 3.3, done: 7.4 }
    trim: [0.3, end]
    hold: 2.0
  - id: b-families
    source: raw/plate.mp4
    marks: source/plate-marks.json
    frame: full
    trim: [families, families.end]
  - id: web-find
    source: raw/web.mp4
    frame: viewport
    label: BROWSER
    marks: source/web-meta.json
    trim: [0.8, start-click - 0.4]
  - id: web-run
    source: raw/web.mp4
    frame: viewport
    label: BROWSER
    xfade: 0.3
    marks: source/web-meta.json
    trim: [start-click - 0.4, done + 3.0]
    zoom:
      - { at: start-click + 0.3, until: 99, over: 0.8, box: [0, 215, 1100, 619] }
  - id: web-runs
    source: raw/web.mp4
    frame: viewport
    label: BROWSER
    xfade: 0.3
    marks: source/web-meta.json
    trim: [back - 0.3, end]
    hold: 0.8
    zoom:
      - { at: runs + 0.3, until: 99, over: 0.9, box: [0, 150, 1300, 731] }
  - id: b-record
    source: raw/plate.mp4
    marks: source/plate-marks.json
    frame: full
    trim: [record, record.end]

lines:
  - { id: n0, scene: open, at: 2.4, text: "Figure four. First workflow." }
  - { id: n1, scene: b-halves, at: n1, text: "In chat, the agent decides what happens next, every turn. That's wrong for work you want done the same way every time. A workflow hands the control flow to a file instead: what runs, in what order, and when. The agent still works inside it, on a leash the file declares." }
  - { id: n2, scene: cli, at: 0.5, text: "Keelson ships starter workflows. The smoke test runs one of every kind of node." }
  - { id: n3, scene: cli, at: done + 0.1, text: "Nine nodes, all green, in a few seconds. Several started at once." }
  - { id: n4, scene: b-families, at: n4, text: "Those nodes come in three families. Agent nodes run model turns: a prompt, a named command, a loop. Deterministic nodes, bash and scripts, run code with no model at all. Control nodes pause for a human, or end a branch on purpose. The mix sets how much is judgment, and how much is fact." }
  - { id: n5, scene: web-find, at: search - 0.6, text: "The browser runs the same workflow, and shows the executor at work." }
  - { id: n6, scene: web-run, at: start-click + 0.2, text: "Every node whose dependencies are met starts right away, and the rest start the moment theirs settle." }
  - { id: n7, scene: web-runs, at: back + 0.2, text: "And both runs are still here: the one from the terminal, and this one." }
  - { id: n8, scene: b-record, at: n8, text: "Because a run is a record. Keelson stores a row for the run and one per node: its output, its timing, the model it really ran on, and a hash of the exact definition. A failed run resumes from the first unfinished node, without redoing finished work." }
  - { id: n9, scene: b-record, at: n9, text: "The file decides. The run remembers." }
  - { id: n10, scene: close, at: 1.6, text: "Keelson. Lay the keel, raise the ribs." }
