<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 17 &nbsp;·&nbsp; ASK FOR A REPORT</span>
  </div>
  <div id="boardName"><span id="bn-what">FROM ANSWER TO PAGE</span><span id="bn-gates">WHAT KEEPS IT HONEST</span><span id="bn-why">KEEP THE PAGE</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker></defs>
  <g id="what" opacity="0">
    <g id="w-chat" opacity="0"><rect x="200" y="220" width="520" height="440" rx="16" fill="#0d1429"/>
      <rect x="240" y="260" width="380" height="40" rx="8" fill="#2a3352"/><rect x="240" y="320" width="440" height="40" rx="8" fill="#1b2442"/><rect x="240" y="380" width="340" height="40" rx="8" fill="#2a3352"/><rect x="240" y="440" width="420" height="40" rx="8" fill="#1b2442"/><rect x="240" y="500" width="300" height="40" rx="8" fill="#2a3352"/>
      <text x="460" y="620" text-anchor="middle" class="mono" font-size="20" fill="#9aa3c0">chat text · scrolls away</text></g>
    <path id="w-arr" d="M730,440 L880,440" stroke="#8a5a1f" stroke-width="4" marker-end="url(#ah)" opacity="0"/>
    <g id="w-tool" opacity="0"><text x="805" y="420" text-anchor="middle" class="mono" font-size="20" fill="#8a5a1f">canvas_publish</text></g>
    <g id="w-page" opacity="0"><rect x="900" y="200" width="820" height="480" rx="16" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
      <rect x="900" y="200" width="820" height="44" rx="16" fill="#e8eef8"/><text x="930" y="230" class="mono" font-size="18" letter-spacing="3" fill="#51607a">CANVAS DRAWER</text>
      <text x="940" y="300" font-size="32" font-weight="700" fill="#0f1b2d">Start tide-range support first</text>
      <rect x="940" y="330" width="170" height="80" rx="8" fill="#e8eef8"/><rect x="1130" y="330" width="170" height="80" rx="8" fill="#e8f3ec"/><rect x="1320" y="330" width="170" height="80" rx="8" fill="#f6ead8"/><rect x="1510" y="330" width="170" height="80" rx="8" fill="#e8eef8"/>
      <rect x="940" y="440" width="740" height="90" rx="8" fill="#f3f5f8" stroke="#c8d2e0"/><rect x="940" y="550" width="740" height="100" rx="8" fill="#f3f5f8" stroke="#c8d2e0"/></g>
    <g id="w-kinds" opacity="0"><text x="1310" y="730" text-anchor="middle" class="mono" font-size="21" fill="#51607a">run reports · briefings · charts</text></g>
  </g>
  <g id="gates" opacity="0"><g id="gg"></g></g>
  <g id="why" opacity="0">
    <g id="y-cols">
      <g id="y-a" opacity="0"><rect x="260" y="240" width="640" height="300" rx="16" fill="#0d1429"/>
        <text x="290" y="300" class="mono" font-size="22" fill="#9aa3c0">keelson home · artifacts/</text>
        <text x="310" y="360" class="mono" font-size="24" fill="#f2c66d">harbor-backlog.html</text>
        <text x="310" y="420" class="mono" font-size="20" fill="#9aa3c0">plain HTML · survives restarts</text></g>
      <g id="y-b" opacity="0"><rect x="1020" y="240" width="640" height="300" rx="16" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
        <text x="1340" y="330" text-anchor="middle" font-size="28" font-weight="600" fill="#0f1b2d">republish the same name</text>
        <text x="1340" y="390" text-anchor="middle" font-size="26" fill="#2f8f5b">→ updated in place</text>
        <text x="1340" y="450" text-anchor="middle" font-size="24" fill="#51607a">keep it · share it</text></g>
    </g>
    <g id="y-recap" opacity="0"><rect x="460" y="300" width="1000" height="200" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="420" text-anchor="middle" font-size="50" font-weight="300" letter-spacing="8" fill="#1e3a5f" opacity="0">ASK ONCE · KEEP THE PAGE</text></g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  { show($("w-chat"), W("n1", "Chat answers") - 0.2);
    show($("w-page"), W("n1", "a page") - 0.2);
    show($("w-kinds"), W("n1", "a run report") - 0.2);
    show($("w-arr"), W("n1", "publish it") - 0.3); show($("w-tool"), W("n1", "single tool") - 0.3);
  }
  { const rows = [["DESIGN GUIDE", "in the prompt: theme tokens · no outside resources · Keelson's palette", "#2f6fb0", "A design guide"], ["VALIDATION", "chart colors checked by computation · contrast · color blindness · fails closed", "#8a5a1f", "Publishing checks"], ["SANDBOX", "opaque-origin frame · CSP connect-src 'none' · no network from the page", "#2f8f5b", "sandboxed frame"]];
    rows.forEach(([a, b, c, ph], i) => { const y = 240 + i * 170, g = el("g", { opacity: 0 }, $("gg"));
      el("rect", { x: 200, y, width: 1520, height: 130, rx: 14, fill: "#fff", stroke: c, "stroke-width": 3 }, g);
      el("text", { x: 240, y: y + 55, class: "mono", "font-size": 24, "letter-spacing": 4, fill: c }, g, a);
      el("text", { x: 240, y: y + 100, "font-size": 26, fill: "#0f1b2d" }, g, b);
      show(g, W("n6", ph) - 0.2, 0.3); });
  }
  { show($("y-a"), W("n7", "plain HTML") - 0.3);
    show($("y-b"), W("n7", "republishing") - 0.2);
    const a = W("n8", "Ask once");
    tl.to($("y-cols"), { opacity: 0.15, duration: 0.5 }, a - 0.5); show($("y-recap"), a - 0.5, 0.4); show($("y-r1"), a - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
