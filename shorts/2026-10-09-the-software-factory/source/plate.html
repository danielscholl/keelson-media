<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 14 &nbsp;·&nbsp; THE SOFTWARE FACTORY</span>
  </div>
  <div id="boardName"><span id="bn-team">A SWARM</span><span id="bn-rules">WHAT ONE AGENT CAN'T DO ALONE</span><span id="bn-why">PIPELINE OR TEAM</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker></defs>
  <g id="team" opacity="0">
    <g id="t-board" opacity="0"><rect x="150" y="250" width="330" height="420" rx="14" fill="#fff" stroke="#51607a" stroke-width="2.5"/>
      <text x="175" y="295" class="mono" font-size="20" letter-spacing="2" fill="#51607a">BEADS</text>
      <rect x="175" y="320" width="280" height="44" rx="8" fill="#e8f3ec" stroke="#2f8f5b"/><text x="190" y="349" class="mono" font-size="18" fill="#2f8f5b">ready  scaffold</text>
      <g fill="#f3f5f8" stroke="#c8d2e0"><rect x="175" y="376" width="280" height="44" rx="8"/><rect x="175" y="432" width="280" height="44" rx="8"/><rect x="175" y="488" width="280" height="44" rx="8"/><rect x="175" y="544" width="280" height="44" rx="8"/></g>
      <text x="315" y="635" text-anchor="middle" class="mono" font-size="18" fill="#51607a">1 ready · 10 waiting</text></g>
    <g id="t-lead" opacity="0"><path d="M490,460 L640,460" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ah)"/>
      <rect x="650" y="400" width="240" height="120" rx="14" fill="#fff8ec" stroke="#b5803a" stroke-width="3.5"/><text x="770" y="455" text-anchor="middle" font-size="28" font-weight="600" fill="#0f1b2d">lead</text><text x="770" y="490" text-anchor="middle" class="mono" font-size="18" fill="#8a5a1f">owns the outcome</text></g>
    <g id="t-workers"></g>
    <g id="t-chan" opacity="0"><rect x="650" y="672" width="1120" height="62" rx="12" fill="#0d1429"/><text x="680" y="711" class="mono" font-size="22" fill="#9aa3c0"># swarm-channel · they coordinate here, you can read and post</text></g>
  </g>
  <g id="rules" opacity="0">
    <g id="r1" opacity="0"><text x="140" y="250" class="mono" font-size="22" letter-spacing="3" fill="#2f6fb0">1 · CRITIQUE THE PLAN FIRST</text>
      <rect x="140" y="275" width="1640" height="90" rx="10" fill="#0d1429"/><text x="170" y="315" class="mono" font-size="19" fill="#c9b6ff">@design-critic</text><text x="170" y="347" class="mono" font-size="19" fill="#dfe6f0">"the design bead must freeze the composition and shared class contract, or browse and detail will diverge"</text></g>
    <g id="r2" opacity="0"><text x="140" y="430" class="mono" font-size="22" letter-spacing="3" fill="#8a5a1f">2 · JUDGE PAGES BY HOW THEY LOOK</text>
      <rect x="140" y="455" width="1640" height="90" rx="10" fill="#0d1429"/><text x="170" y="495" class="mono" font-size="19" fill="#9aa3c0">screenshots at 1440 and 375 px → critic → one change, until it approves</text><text x="170" y="527" class="mono" font-size="19" fill="#f2c66d">fix: distinguish Andromeda with broad tapering spiral arms</text></g>
    <g id="r3" opacity="0"><text x="140" y="610" class="mono" font-size="22" letter-spacing="3" fill="#2f8f5b">3 · NEVER MERGE UNREAD WORK</text>
      <rect x="140" y="635" width="1640" height="130" rx="10" fill="#0d1429"/><text x="170" y="675" class="mono" font-size="19" fill="#5fd7a7">@reviewer</text><text x="320" y="675" class="mono" font-size="19" fill="#dfe6f0">"APPROVE 55ac7db for cosmos-qsd."</text>
      <text x="170" y="715" class="mono" font-size="19" fill="#f2c66d">@lead</text><text x="320" y="715" class="mono" font-size="19" fill="#dfe6f0">"merged as 4107342; cosmos-qsd closed. Next: cosmos-sed (catalog)."</text></g>
  </g>
  <g id="why" opacity="0">
    <g id="y-cols">
      <g id="y-pipe" opacity="0"><text x="480" y="260" text-anchor="middle" class="mono" font-size="24" letter-spacing="3" fill="#51607a">A WORKFLOW</text>
        <g fill="#fff" stroke="#51607a" stroke-width="2.5"><rect x="230" y="300" width="500" height="70" rx="10"/><rect x="230" y="400" width="500" height="70" rx="10"/><rect x="230" y="500" width="500" height="70" rx="10"/></g>
        <g class="mono" font-size="22" fill="#0f1b2d" text-anchor="middle"><text x="480" y="343">step one</text><text x="480" y="443">step two</text><text x="480" y="543">step three</text></g>
        <text x="480" y="630" text-anchor="middle" font-size="26" fill="#0f1b2d">one plan, one order</text></g>
      <g id="y-team" opacity="0"><text x="1440" y="260" text-anchor="middle" class="mono" font-size="24" letter-spacing="3" fill="#8a5a1f">A FACTORY</text>
        <circle cx="1440" cy="440" r="140" fill="none" stroke="#c8d2e0" stroke-width="4"/>
        <g class="mono" font-size="22"><text x="1440" y="290" text-anchor="middle" fill="#2f6fb0">read the graph</text><text x="1600" y="445" fill="#8a5a1f">staff it</text><text x="1440" y="610" text-anchor="middle" fill="#2f8f5b">check its own work</text><text x="1150" y="445" fill="#0f1b2d">merge</text></g>
        <text x="1440" y="680" text-anchor="middle" font-size="26" fill="#0f1b2d">runs while work lands</text></g>
    </g>
    <g id="y-recap" opacity="0"><rect x="360" y="380" width="1200" height="200" fill="rgba(243,245,248,.96)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="500" text-anchor="middle" font-size="50" font-weight="300" letter-spacing="8" fill="#1e3a5f" opacity="0">READY IN · REVIEWED OUT</text></g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  { show($("t-board"), W("n1", "one bead") - 0.3);
    show($("t-lead"), W("n1", "a lead agent") - 0.2);
    const g = $("t-workers"), ws = [["writer · core", "own worktree", "#2f6fb0"], ["writer · design", "own worktree", "#2f6fb0"], ["design critic", "read-only", "#8a5a1f"], ["reviewer", "read-only", "#2f8f5b"]];
    ws.forEach(([n, s, c], i) => { const y = 230 + i * 110, r = el("g", { opacity: 0 }, g);
      el("path", { d: `M890,460 L1090,${y + 45}`, stroke: "#c8d2e0", "stroke-width": 2.5 }, r);
      el("rect", { x: 1100, y, width: 420, height: 90, rx: 12, fill: "#fff", stroke: c, "stroke-width": 2.5 }, r);
      el("text", { x: 1125, y: y + 40, "font-size": 24, "font-weight": 600, fill: "#0f1b2d" }, r, n);
      el("text", { x: 1125, y: y + 72, class: "mono", "font-size": 17, fill: c }, r, s);
      show(r, W("n1", "workers it spawns") - 0.2 + i * 0.25); });
    show($("t-chan"), W("n1", "a channel") - 0.2);
  }
  { show($("r1"), W("n6", "critique the plan") - 0.3);
    show($("r2"), W("n6", "design critic") - 0.3);
    show($("r3"), W("n6", "no head merges") - 0.3);
  }
  { show($("y-pipe"), W("n12", "A workflow") - 0.3);
    show($("y-team"), W("n12", "A factory") - 0.3);
    const a = W("n13", "Ready work");
    tl.to($("y-cols"), { opacity: 0.15, duration: 0.5 }, a - 0.5); show($("y-recap"), a - 0.5, 0.4); show($("y-r1"), a - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
