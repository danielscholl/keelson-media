fig: "05"
slug: write-a-workflow
title: Write a workflow
act: II
problem: How do you turn work you want done the same way every time into something Keelson can check and run?
docs: [tutorials/run-a-workflow, guides/authoring-workflows, reference/workflow-nodes]
voice: en-US-Harper:MAI-Voice-2.1
bookends: { open: lay-the-keel, close: raise-the-ribs }
crossfade: 0.5

plate:
  html: source/plate.html
  out: raw/plate.mp4
  boards:
    - { id: graph, lines: [n1], lead: 0.5, tail: 1.0 }
    - { id: check, lines: [n4], lead: 0.4, tail: 1.2 }
    - { id: why, lines: [n9, n10], lead: 0.4, gap: 0.6, tail: 1.6 }

scenes:
  - id: b-graph
    source: raw/plate.mp4
    marks: source/plate-marks.json
    frame: full
    trim: [graph, graph.end]
    xfade: 0.8
  - id: file
    source: raw/broken.mp4
    frame: viewport
    label: TERMINAL
    marks: { enter: 3.0 }
    trim: [0.3, 8.5]
    hold: 2.2
    zoom:
      - { at: enter + 2.6, until: 99, over: 1.2, box: [0, 380, 1300, 731] }
  - id: invalid
    source: raw/broken.mp4
    frame: viewport
    label: TERMINAL
    xfade: 0.3
    marks: { typing: 8.6, enter: 12.7, output: 12.9 }
    trim: [typing - 0.2, output + 3.4]
    hold: 0.4
    zoom:
      - { at: output + 0.4, until: 99, over: 0.9, box: [0, 20, 1300, 731] }
  - id: b-check
    source: raw/plate.mp4
    marks: source/plate-marks.json
    frame: full
    trim: [check, check.end]
  - id: fix
    source: raw/fixed.mp4
    frame: viewport
    label: TERMINAL
    marks: { vim: 3.5, find: 5.5, insert: 6.3, save: 8.2 }
    trim: [vim - 0.3, save + 0.2]
    zoom:
      - { at: vim + 0.4, until: 99, over: 0.8, box: [0, 300, 1300, 731] }
  - id: revalid
    source: raw/fixed.mp4
    frame: viewport
    label: TERMINAL
    xfade: 0.3
    marks: { enter: 12.7, output: 12.8 }
    trim: [enter - 0.8, output + 2.2]
    zoom:
      - { at: output + 0.2, until: 99, over: 0.6, box: [0, 20, 1300, 731] }
  - id: run
    source: raw/fixed.mp4
    frame: viewport
    label: TERMINAL
    xfade: 0.3
    marks: { typing: 16.6, enter: 20.6, start: 21.9, done: 25.7 }
    trim: [typing - 0.2, done + 2.0]
    hold: 0.5
    zoom:
      - { at: done - 0.6, until: 99, over: 0.9, box: [0, 420, 1300, 731] }
  - id: web-run
    source: raw/web-run.mp4
    frame: viewport
    label: BROWSER
    marks: { open: 2.23, graph: 4.75, expand: 5.88 }
    trim: [1.0, end]
    hold: 1.2
    masks:
      - { box: [1403, 148, 96, 22], color: "0x131a30", from: open, to: 99 }
      - { box: [1152, 419, 90, 20], color: "0x131a30", from: open, to: 99 }
    zoom:
      - { at: expand + 0.6, until: 99, over: 1.0, box: [930, 230, 980, 551] }
  - id: b-why
    source: raw/plate.mp4
    marks: source/plate-marks.json
    frame: full
    trim: [why, why.end]

lines:
  - { id: n0, scene: open, at: 2.4, text: "Figure five. Write a workflow." }
  - { id: n1, scene: b-graph, at: n1, text: "Chat is improvisation. When work has to run the same way every time, you write it down as a workflow: a YAML file of nodes, where depends on draws the edges between them. Keelson reads the file as a graph, and runs it in that order, every time.",
      ssml: "Chat is improvisation. When work has to run the same way every time, you write it down as a workflow: a <sub alias='yammel'>YAML</sub> file of nodes, where depends on draws the edges between them. Keelson reads the file as a graph, and runs it in that order, every time." }
  - { id: n2, scene: file, at: 0.4, text: "Here's one for the harbor repo: run the tests, print the tides, then have an agent report on both. The last line points at a node called tide. There isn't one." }
  - { id: n3, scene: invalid, at: typing + 0.6, text: "Validate runs the same loader the server uses, and it names the problem before anything runs." }
  - { id: n4, scene: b-check, at: n4, text: "That's why you validate first. The loader checks that every edge lands on a real node, every output a prompt reads comes from one, and there are no cycles. An unknown field is only a warning. But a broken edge found at run time would stop the run halfway, after earlier steps had already done their work." }
  - { id: n5, scene: fix, at: find - 1.2, text: "Add the missing letter, save, and validate again." }
  - { id: n6, scene: revalid, at: output + 0.3, text: "Clean." }
  - { id: n7, scene: run, at: typing + 0.4, text: "Now run it. Test and tides depend on nothing, so they start together. Report waits for both, and their output is wired into its prompt." }
  - { id: n8, scene: web-run, at: open - 0.8, text: "In the browser, the run is the same graph. The report read the two results it was handed, and kept the time exactly as printed." }
  - { id: n9, scene: b-why, at: n9, text: "So a workflow is a file you can read, a graph Keelson can check, and a run that goes the same way every time. Chat leaves the control flow to the model. A workflow takes it back, and hands the model only the steps that need one." }
  - { id: n10, scene: b-why, at: n10, text: "Write it, check it, run it." }
  - { id: n11, scene: close, at: 1.6, text: "Keelson. Lay the keel, raise the ribs." }
