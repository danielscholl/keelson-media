<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 16 &nbsp;·&nbsp; NO PAID KEYS</span>
  </div>
  <div id="boardName"><span id="bn-gw">A GATEWAY</span><span id="bn-limits">WHAT IT IS TODAY</span><span id="bn-why">WHY IT MATTERS</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker></defs>
  <g id="gw" opacity="0">
    <g id="g-k" opacity="0"><rect x="1100" y="220" width="620" height="440" rx="16" fill="rgba(255,255,255,.85)" stroke="#1e3a5f" stroke-width="3"/>
      <text x="1130" y="270" class="mono" font-size="21" letter-spacing="3" fill="#51607a">KEELSON · PROVIDERS</text>
      <rect x="1130" y="300" width="560" height="60" rx="10" fill="#e8eef8"/><text x="1150" y="340" class="mono" font-size="23" fill="#0f1b2d">copilot</text><text x="1670" y="340" text-anchor="end" class="mono" font-size="19" fill="#51607a">subscription</text>
      <rect x="1130" y="375" width="560" height="60" rx="10" fill="#e8eef8"/><text x="1150" y="415" class="mono" font-size="23" fill="#0f1b2d">claude · codex · pi</text><text x="1670" y="415" text-anchor="end" class="mono" font-size="19" fill="#51607a">built in</text></g>
    <g id="g-new" opacity="0"><rect x="1130" y="450" width="560" height="60" rx="10" fill="#e8f3ec" stroke="#2f8f5b" stroke-width="2.5"/><text x="1150" y="490" class="mono" font-size="23" fill="#0f1b2d">ollama</text><text x="1670" y="490" text-anchor="end" class="mono" font-size="19" fill="#2f8f5b">gateway · its own name</text></g>
    <g id="g-eps"></g>
    <g id="g-api" opacity="0"><text x="800" y="200" text-anchor="middle" class="mono" font-size="21" fill="#8a5a1f">OpenAI chat API</text></g>
  </g>
  <g id="limits" opacity="0">
    <g id="l-rows"></g>
  </g>
  <g id="why" opacity="0">
    <g id="y-cols"></g>
    <g id="y-recap" opacity="0"><rect x="400" y="300" width="1120" height="200" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="420" text-anchor="middle" font-size="48" font-weight="300" letter-spacing="7" fill="#1e3a5f" opacity="0">ANY ENDPOINT · ONE MORE PROVIDER</text></g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  { show($("g-k"), T.gw.s + 0.3);
    const eps = [["local Ollama", "Ollama"], ["vLLM", "vLLM"], ["OpenRouter", "OpenRouter"], ["Azure OpenAI", "or Azure"]];
    eps.forEach(([n, ph], i) => { const y = 260 + i * 100, g = el("g", { opacity: 0 }, $("g-eps"));
      el("rect", { x: 200, y, width: 360, height: 70, rx: 12, fill: "#fff", stroke: i === 0 ? "#2f8f5b" : "#51607a", "stroke-width": 2.5 }, g);
      el("text", { x: 380, y: y + 44, "text-anchor": "middle", "font-size": 25, "font-weight": 600, fill: "#0f1b2d" }, g, n);
      el("path", { d: `M565,${y + 35} C800,${y + 35} 900,480 1120,480`, stroke: i === 0 ? "#2f8f5b" : "#c8d2e0", "stroke-width": 2.5, fill: "none", "marker-end": "url(#ah)" }, g);
      show(g, W("n1", ph) - 0.2, 0.3); });
    show($("g-api"), W("n1", "OpenAI chat API") - 0.2);
    show($("g-new"), W("n1", "registers it") - 0.1);
  }
  { const rows = [["key", "keychain only · HTTPS or loopback · none for local", "#2f6fb0", "A key"], ["streams", "yes", "#2f8f5b", "Turns stream"], ["tools", "not yet · no Keelson tools", "#b8433a", "don't get"], ["session", "no resume · each turn starts fresh", "#b8433a", "don't resume"], ["cost", "unpriced, never shown as free", "#8a5a1f", "unpriced"]];
    rows.forEach(([a, b, c, ph], i) => { const y = 220 + i * 100, g = el("g", { opacity: 0 }, $("l-rows"));
      el("rect", { x: 260, y, width: 1400, height: 76, rx: 12, fill: "#fff", stroke: "#c8d2e0", "stroke-width": 2 }, g);
      el("text", { x: 300, y: y + 48, class: "mono", "font-size": 24, "letter-spacing": 2, fill: "#51607a" }, g, a.toUpperCase());
      el("text", { x: 560, y: y + 48, "font-size": 27, fill: c }, g, b);
      show(g, W("n6", ph) - 0.2, 0.3); });
  }
  { const items = [["nothing to buy", "try the whole harness", "nothing to buy"], ["on your machine", "keep a conversation local", "own machine"], ["your team's endpoint", "point at what you run", "your team"]];
    const gs = items.map(([a, b, ph], i) => { const x = 200 + i * 520, g = el("g", { opacity: 0 }, $("y-cols"));
      el("rect", { x, y: 260, width: 480, height: 240, rx: 16, fill: "rgba(255,255,255,.8)", stroke: "#1e3a5f", "stroke-width": 3 }, g);
      el("text", { x: x + 240, y: 360, "text-anchor": "middle", "font-size": 32, "font-weight": 600, fill: "#0f1b2d" }, g, a);
      el("text", { x: x + 240, y: 420, "text-anchor": "middle", "font-size": 24, fill: "#51607a" }, g, b);
      show(g, W("n7", ph) - 0.3, 0.3); return g; });
    const a = W("n8", "Any endpoint");
    tl.to($("y-cols"), { opacity: 0.15, duration: 0.5 }, a - 0.5); show($("y-recap"), a - 0.5, 0.4); show($("y-r1"), a - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
