<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 07 &nbsp;·&nbsp; MANY MODELS</span>
  </div>
  <div id="boardName"><span id="bn-classes">A MODEL PER NODE</span><span id="bn-contract">THE FILE IS THE CONTRACT</span><span id="bn-why">RUN THE EXPERIMENT</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker>
    <marker id="ahn" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e3a5f"/></marker>
  </defs>

  <!-- A MODEL PER NODE -->
  <g id="classes" opacity="0">
    <g id="c-scale" opacity="0">
      <line x1="300" y1="250" x2="1620" y2="250" stroke="#c8d2e0" stroke-width="6" stroke-linecap="round"/>
      <text x="300" y="215" class="mono" font-size="21" letter-spacing="3" fill="#2f8f5b">FAST · CHEAP</text>
      <text x="1620" y="215" text-anchor="end" class="mono" font-size="21" letter-spacing="3" fill="#2f6fb0">DEEP · COSTLY</text>
      <text id="c-grind" x="300" y="300" class="mono" font-size="19" fill="#b8433a" opacity="0">careless on judgment</text>
      <text id="c-costly" x="1620" y="300" text-anchor="end" class="mono" font-size="19" fill="#b8433a" opacity="0">wasted on grind work</text>
    </g>
    <g id="c-nodes"></g>
    <g id="c-resolve" opacity="0">
      <text x="960" y="770" text-anchor="middle" class="mono" font-size="21" letter-spacing="3" fill="#51607a">CLASS → YOUR PROVIDER'S CATALOG</text>
    </g>
  </g>

  <!-- THE FILE IS THE CONTRACT -->
  <g id="contract" opacity="0">
    <g id="k-row"></g>
    <g id="k-chat" opacity="0">
      <path d="M520,560 C700,660 1220,660 1400,560" stroke="#b8433a" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
      <line x1="930" y1="620" x2="990" y2="680" stroke="#b8433a" stroke-width="5"/><line x1="990" y1="620" x2="930" y2="680" stroke="#b8433a" stroke-width="5"/>
      <text x="960" y="730" text-anchor="middle" class="mono" font-size="21" fill="#b8433a">no shared chat history</text>
    </g>
    <g id="k-fresh" opacity="0"><text x="960" y="200" text-anchor="middle" class="mono" font-size="22" letter-spacing="3" fill="#2f8f5b">EACH NODE OPENS THE FILE WITH A FRESH CONTEXT</text></g>
    <g id="k-swap" opacity="0">
      <rect x="1290" y="330" width="260" height="180" rx="14" fill="none" stroke="#b5803a" stroke-width="4" stroke-dasharray="10 8"/>
      <text x="1420" y="545" text-anchor="middle" class="mono" font-size="21" fill="#8a5a1f">swap this, nothing else moves</text>
    </g>
  </g>

  <!-- RUN THE EXPERIMENT -->
  <g id="why" opacity="0">
    <g id="w-cols">
      <g id="w-a" opacity="0"><rect x="200" y="230" width="460" height="300" rx="14" fill="#0d1429"/>
        <text x="230" y="300" class="mono" font-size="26" fill="#dfe6f0">- id: review</text>
        <text x="230" y="350" class="mono" font-size="26" fill="#dfe6f0">  model: <tspan fill="#b8433a" text-decoration="line-through">balanced</tspan></text>
        <text x="230" y="400" class="mono" font-size="26" fill="#dfe6f0">  model: <tspan fill="#5fd7a7">gpt-6-luna</tspan></text>
        <text x="430" y="590" text-anchor="middle" font-size="30" font-weight="600" fill="#0f1b2d">pins live in the file</text></g>
      <g id="w-b" opacity="0"><rect x="730" y="230" width="460" height="300" rx="14" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
        <text x="760" y="300" class="mono" font-size="22" fill="#0f1b2d">explore  <tspan fill="#2f6fb0">claude-haiku-4.5</tspan></text>
        <text x="760" y="360" class="mono" font-size="22" fill="#0f1b2d">plan     <tspan fill="#2f6fb0">claude-opus-5</tspan></text>
        <text x="760" y="420" class="mono" font-size="22" fill="#0f1b2d">review   <tspan fill="#2f6fb0">gpt-6-luna</tspan></text>
        <text x="960" y="590" text-anchor="middle" font-size="30" font-weight="600" fill="#0f1b2d">the run records who answered</text></g>
      <g id="w-c" opacity="0"><rect x="1260" y="230" width="460" height="300" rx="14" fill="#fff" stroke="#b5803a" stroke-width="3"/>
        <text x="1490" y="330" text-anchor="middle" class="mono" font-size="28" fill="#2f8f5b">run 1 · sound</text>
        <text x="1490" y="400" text-anchor="middle" class="mono" font-size="28" fill="#b8433a">run 2 · unsound</text>
        <text x="1490" y="460" text-anchor="middle" class="mono" font-size="20" fill="#51607a">compare, then decide</text>
        <text x="1490" y="590" text-anchor="middle" font-size="30" font-weight="600" fill="#0f1b2d">a swap is one line</text></g>
    </g>
    <g id="w-recap" opacity="0">
      <rect x="460" y="300" width="1000" height="220" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="w-r1" x="960" y="400" text-anchor="middle" font-size="56" font-weight="300" letter-spacing="9" fill="#1e3a5f" opacity="0">RIGHT MODEL</text>
      <text id="w-r2" x="960" y="480" text-anchor="middle" font-size="56" font-weight="300" letter-spacing="9" fill="#8a5a1f" opacity="0">RIGHT PHASE</text>
    </g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  // A MODEL PER NODE
  { const s = T.classes.s, nodes = $("c-nodes");
    show($("c-scale"), s + 0.2, 0.5);
    show($("c-costly"), W("n1", "costly on grind") - 0.1, 0.3);
    show($("c-grind"), W("n1", "careless on") - 0.1, 0.3);
    const defs = [["explore", "fast", "#2f8f5b", 360, "claude-haiku-4.5"], ["plan", "deep", "#2f6fb0", 1560, "claude-opus-5"], ["review", "balanced", "#8a5a1f", 960, "claude-sonnet-5"]];
    const pin = W("n1", "pins its own");
    const res = W("n1", "resolves that class");
    defs.forEach(([id, cls, col, cx, real], i) => {
      const g = el("g", { opacity: 0 }, nodes);
      el("rect", { x: cx - 160, y: 380, width: 320, height: 120, rx: 14, fill: "#fff", stroke: "#1e3a5f", "stroke-width": 3 }, g);
      el("text", { x: cx, y: 430, "text-anchor": "middle", "font-size": 32, "font-weight": 600, fill: "#0f1b2d" }, g, id);
      el("text", { x: cx, y: 475, "text-anchor": "middle", class: "mono", "font-size": 22, fill: col }, g, `model: ${cls}`);
      el("path", { d: `M${cx},375 L${cx},262`, stroke: col, "stroke-width": 2.5, "stroke-dasharray": "6 6" }, g);
      el("circle", { cx, cy: 250, r: 14, fill: col }, g);
      show(g, pin - 0.2 + i * 0.35, 0.3);
      const r = el("g", { opacity: 0 }, nodes);
      el("path", { d: `M${cx},505 L${cx},600`, stroke: "#1e3a5f", "stroke-width": 2.5, "marker-end": "url(#ahn)" }, r);
      el("rect", { x: cx - 160, y: 610, width: 320, height: 64, rx: 10, fill: "#0d1429" }, r);
      el("text", { x: cx, y: 651, "text-anchor": "middle", class: "mono", "font-size": 22, fill: "#dfe6f0" }, r, real);
      show(r, res + 0.3 + i * 0.3, 0.3);
    });
    show($("c-resolve"), res + 0.2);
  }

  // THE FILE IS THE CONTRACT
  { const s = T.contract.s, row = $("k-row");
    const ns = [["explore", "haiku", 230], ["plan", "opus", 830], ["review", "any model", 1430]];
    const files = [["context.md", 590], ["plan.md", 1190]];
    const gs = [];
    ns.forEach(([n, m, x]) => { const g = el("g", { opacity: 0 }, row);
      el("rect", { x, y: 340, width: 260, height: 160, rx: 14, fill: "#fff", stroke: "#1e3a5f", "stroke-width": 3 }, g);
      el("text", { x: x + 130, y: 410, "text-anchor": "middle", "font-size": 32, "font-weight": 600, fill: "#0f1b2d" }, g, n);
      el("text", { x: x + 130, y: 455, "text-anchor": "middle", class: "mono", "font-size": 20, fill: "#2f6fb0" }, g, m);
      gs.push(g); });
    const fg = [];
    files.forEach(([f, x]) => { const g = el("g", { opacity: 0 }, row);
      el("path", { d: `M${x - 90},420 L${x - 10},420`, stroke: "#8a5a1f", "stroke-width": 3, "marker-end": "url(#ah)" }, g);
      el("path", { d: `M${x},370 L${x + 110},370 L${x + 140},400 L${x + 140},470 L${x},470 Z`, fill: "#fff", stroke: "#8a5a1f", "stroke-width": 2.5 }, g);
      el("text", { x: x + 70, y: 432, "text-anchor": "middle", class: "mono", "font-size": 17, fill: "#8a5a1f" }, g, f);
      el("path", { d: `M${x + 145},420 L${x + 225},420`, stroke: "#8a5a1f", "stroke-width": 3, "marker-end": "url(#ah)" }, g);
      fg.push(g); });
    show(gs[0], s + 0.2, 0.3); show(gs[1], s + 0.4, 0.3); show(gs[2], s + 0.6, 0.3);
    show($("k-chat"), W("n5", "another's conversation") - 0.2);
    const wr = W("n5", "writes its conclusions");
    tl.to($("k-chat"), { opacity: 0.25, duration: 0.4 }, wr);
    show(fg[0], wr, 0.3); show(fg[1], wr + 0.4, 0.3);
    show($("k-fresh"), W("n5", "fresh context") - 0.2);
    show($("k-swap"), W("n5", "change models") - 0.2);
  }

  // RUN THE EXPERIMENT
  { show($("w-a"), W("n9", "The pins") - 0.1);
    show($("w-b"), W("n9", "the run records") - 0.1);
    show($("w-c"), W("n9", "a swap") - 0.1);
    const rm = W("n10", "Right model");
    tl.to($("w-cols"), { opacity: 0.15, duration: 0.5 }, rm - 0.5);
    show($("w-recap"), rm - 0.5, 0.4);
    show($("w-r1"), rm - 0.1); show($("w-r2"), W("n10", "right phase") - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
