  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  // THREE WAYS IN
  { const s = T.doors.s;
    tl.set($("o-old"), { opacity: 0 }, s); show($("o-old"), s + 0.1, 0.5);
    const bel = W("n1", "belongs to the window");
    draw($("o-lock"), bel, 0.9); show($("o-lockLbl"), bel + 0.5);
    const kg = W("n1", "Keelson gives you");
    tl.to($("o-old"), { opacity: 0, duration: 0.5 }, kg - 0.2);
    tl.set($("o-new"), { opacity: 1 }, kg);
    show($("o-c1"), W("n1", "the browser") - 0.1);
    show($("o-c2"), W("n1", "interactive terminal") - 0.1);
    show($("o-c3"), W("n1", "one-line command") - 0.1);
    const same = W("n1", "All three reach");
    [["o-a1", 0], ["o-a2", 0.15], ["o-a3", 0.3]].forEach(([id, d]) => draw($(id), same + d, 0.7));
    const conv = W("n1", "same conversation");
    show($("o-conv"), conv - 0.5);
    ["o-m1", "o-m2", "o-m3"].forEach((id, i) => show($(id), conv + 0.1 + i * 0.25, 0.3));
  }

  // WHERE THE CONVERSATION LIVES
  { const s = T.store.s, dot = $("s-dot");
    draw($("s-machine"), s + 0.05, 1.0); show($("s-machineLbl"), s + 0.4);
    show($("s-clients"), s + 0.3);
    const na = W("n4", "None of the three");
    show($("s-notapp"), na + 0.3, 0.3); tl.to($("s-notapp"), { opacity: 0, duration: 0.4 }, W("n4", "Each is a"));
    const cl = W("n4", "client of one");
    draw($("s-l1"), cl, 0.5); draw($("s-l2"), cl + 0.1, 0.5); draw($("s-l3"), cl + 0.2, 0.5); show($("s-proto"), cl + 0.4);
    show($("s-srv"), W("n4", "local server") - 0.2);
    const runs = W("n4", "runs the turn");
    show($("s-cloud"), runs - 0.2); show($("s-tc"), runs - 0.2);
    tl.set(dot, { opacity: 1, attr: { cx: 1082, cy: 470 } }, runs);
    tl.to(dot, { attr: { cx: 1440, cy: 268 }, duration: 0.7, ease: "power1.inOut" }, runs + 0.05);
    tl.to(dot, { attr: { cx: 890, cy: 590 }, duration: 0.8, ease: "power1.inOut" }, runs + 0.9);
    const wr = W("n4", "writes the conversation");
    show($("s-ts"), wr - 0.3); show($("s-db"), wr - 0.3);
    tl.to(dot, { attr: { cy: 720 }, duration: 0.5, ease: "power1.in" }, wr - 0.1);
    tl.to(dot, { opacity: 0, duration: 0.2 }, wr + 0.4);
    draw($("s-trow"), wr + 0.2, 0.4); show($("s-row"), wr + 0.5);
    const msgs = $("s-msgs");
    const rows = [["you", "Codename for our harbor…"], ["agent", "Breakwater"], ["you", "Why that name?"], ["agent", "“Breakwater” suggests…"]];
    const em = W("n4", "every message");
    rows.forEach(([who, txt], i) => {
      const y = 630 + i * 50, g = el("g", { opacity: 0 }, msgs);
      el("text", { x: 1176, y, class: "mono", "font-size": 19, fill: who === "you" ? "#8a5a1f" : "#2f6fb0" }, g, who.padEnd(6));
      el("text", { x: 1270, y, "font-size": 22, fill: "#0f1b2d" }, g, txt);
      show(g, em + i * 0.18, 0.25);
    });
    const sess = W("n4", "agent's session");
    show($("s-sessBg"), sess - 0.2, 0.3); show($("s-sess"), sess - 0.1, 0.3);
    // the next turn arrives through a different client and lands on the same row
    const nt = W("n4", "next turn");
    tl.set(dot, { opacity: 1, attr: { cx: 472, cy: 525 } }, nt - 0.2);
    tl.to(dot, { attr: { cx: 700, cy: 505 }, duration: 0.6, ease: "power1.inOut" }, nt - 0.15);
    tl.to(dot, { attr: { cx: 890, cy: 720 }, duration: 0.7, ease: "power1.inOut" }, nt + 0.5);
    tl.to(dot, { opacity: 0, duration: 0.2 }, nt + 1.2);
    const g5 = el("g", { opacity: 0 }, msgs);
    el("text", { x: 1176, y: 830, class: "mono", "font-size": 19, fill: "#8a5a1f" }, g5, "you   ");
    el("text", { x: 1270, y: 830, "font-size": 22, fill: "#0f1b2d" }, g5, "A one-line tagline…");
    show(g5, nt + 1.2, 0.3);
    const ww = W("n4", "whichever way");
    tl.to([$("s-l1"), $("s-l2"), $("s-l3")], { attr: { stroke: "#b5803a" }, duration: 0.3, yoyo: true, repeat: 1 }, ww);
  }

  // WHY THREE
  { const s = T.why.s;
    show($("w-c1"), W("n11", "The browser") - 0.1);
    show($("w-c2"), W("n11", "The terminal") - 0.1);
    show($("w-model"), W("n11", "switch models") - 0.1);
    show($("w-c3"), W("n11", "And the script") - 0.1);
    show($("w-json"), W("n11", "JSON to pipe") - 0.1);
    show($("w-exit"), W("n11", "exit code") - 0.1);
    const tw = W("n12", "Three ways in");
    draw($("w-l1"), tw - 0.6, 0.6); draw($("w-l2"), tw - 0.5, 0.6); draw($("w-l3"), tw - 0.4, 0.6); show($("w-db"), tw - 0.1);
    const ev = W("n12", "Everything after");
    tl.to($("w-cols"), { opacity: 0.16, duration: 0.6 }, ev - 0.4);
    show($("w-recap"), ev - 0.4, 0.6);
    show($("w-r1"), ev - 0.2); show($("w-r2"), ev + 0.2); show($("w-r3"), W("n12", "builds on"));
  }
  return tl.duration();
};
</script>
