<!doctype html>
<html>
<head>

<style>

  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);

      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,

  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:420px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>

      <text id="p-r3" x="960" y="574" text-anchor="middle" font-size="34" font-weight="400" letter-spacing="4" fill="#8a5a1f" opacity="0">A DOCTOR THAT NAMES THE NEXT MOVE</text>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  // Time a phrase is spoken: the k-th occurrence of its word sequence in the line, on the plate clock.
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => { tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at); };
  const board = (id) => {
    tl.set($(id), { opacity: 1 }, T[id].s);
    tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s);
    tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  };
  for (const id of Object.keys(T)) board(id);

  // THE HOME
  { const s = T.home.s;
    draw($("h-machine"), s + 0.05, 1.0); show($("h-machineLbl"), s + 0.4);
    const t1 = W("n1", "One line");
    show($("h-term"), t1 - 0.2, 0.3); tl.to($("typeRect"), { attr: { width: 440 }, duration: 1.0, ease: "none" }, t1);
    draw($("h-arrow"), W("n1", "installs"), 0.5);
    draw($("h-folder"), W("n1", "into a single") , 1.0); show($("h-folderLbl"), W("n1", "folder"));
    show($("h-row1"), W("n1", "command line") - 0.1);
    show($("h-row2"), W("n1", "workflows") - 0.1);
    show($("h-row3"), W("n1", "database") - 0.1);
    show($("h-row4"), W("n1", "ribs") - 0.1);
    const nh = W("n1", "No hosted");
    show($("h-cloud"), nh - 0.1, 0.3); draw($("h-strike"), nh + 0.3, 0.4);
    show($("h-noacct"), W("n1", "Keelson account") - 0.2);
  }

  // THE HEALTH CHECK
  { const s = T.doctor.s, rows = $("d-rows");
    const cats = [["toolchain", "ok"], ["server", "warn"], ["db", "warn"], ["auth", "ok"], ["workflows", "ok"], ["providers", "ok"], ["ribs", "skip"]];
    show($("d-title"), s + 0.1);
    const warnBg = [];
    cats.forEach(([name, st], i) => {
      const y = 326 + i * 64, g = el("g", { opacity: 0 }, rows);
      const bg = el("rect", { x: 170, y: y - 30, width: 840, height: 52, rx: 6, fill: "#f6ead8", opacity: 0 }, g);
      if (st === "warn") warnBg.push(bg);
      el("text", { x: 196, y: y + 7, class: "mono", "font-size": 28, fill: "#0f1b2d" }, g, name);
      const c = { ok: ["#2f8f5b", "#e8f3ec"], warn: ["#8a5a1f", "#fff"], skip: ["#51607a", "#fff"] }[st];
      el("rect", { x: 860, y: y - 20, width: 120, height: 38, rx: 19, fill: c[1], stroke: c[0], "stroke-width": 2 }, g);
      el("text", { x: 920, y: y + 7, "text-anchor": "middle", class: "mono", "font-size": 22, "font-weight": 700, fill: c[0] }, g, st);
      show(g, s + 0.35 + i * 0.12, 0.25);
    });
    show($("d-summary"), s + 1.3);
    const tw = W("n3", "Two warnings");
    warnBg.forEach((bg) => show(bg, tw, 0.3));
    show($("d-hint1"), W("n3", "no server") - 0.1);
    show($("d-hint2"), W("n3", "no database") - 0.1);
    const ew = W("n3", "Each warning");
    tl.to([$("d-hint1"), $("d-hint2")], { opacity: 0.35, duration: 0.25, yoyo: true, repeat: 1 }, ew);
    const st = W("n3", "start the server");
    draw($("d-arr1"), st - 0.3, 0.5); draw($("d-arr2"), st - 0.3, 0.5); show($("d-fix"), st + 0.1, 0.35);
  }

  // THE SERVER
  { const s = T.server.s;
    draw($("s-machine"), s + 0.05, 1.0); show($("s-machineLbl"), s + 0.4);
    show($("s-cmd"), W("n4", "That one command") - 0.1);
    const srv = W("n4", "single local server");
    draw($("s-cmdLine"), srv - 0.4, 0.4); show($("s-box"), srv);
    draw($("s-l1"), W("n4", "the store") - 0.2, 0.4); show($("s-store"), W("n4", "store"));
    draw($("s-l2"), W("n4", "the agents") - 0.2, 0.4); show($("s-agents"), W("n4", "agents"));
    draw($("s-l3"), W("n4", "the browser") - 0.2, 0.4); show($("s-browser"), W("n4", "browser app"));
    draw($("s-l4"), W("n4", "an endpoint") - 0.2, 0.4); show($("s-mcp"), W("n4", "endpoint"));
    const port = W("n4", "one port");
    tl.to($("s-port"), { fill: "#8a5a1f", duration: 0.3 }, port);
    tl.to($("s-links"), { attr: { stroke: "#b5803a" }, duration: 0.3, yoyo: true, repeat: 1 }, port);
  }

  // ONE TURN
  { const s = T.path.s, dot = $("p-dot");
    draw($("p-machine"), s + 0.05, 0.9); show($("p-machineLbl"), s + 0.3);
    show($("p-cli"), s + 0.2); show($("p-srv"), s + 0.4); show($("p-cloud"), s + 0.6); show($("p-store"), s + 0.8);
    ["p-t1", "p-t2", "p-t3", "p-t4"].forEach((id, i) => show($(id), s + 0.3 + i * 0.15, 0.4));
    const toSrv = W("n8", "to the server");
    tl.set(dot, { opacity: 1, attr: { cx: 552, cy: 465 } }, toSrv - 0.6);
    tl.to(dot, { attr: { cx: 840 }, duration: 0.6, ease: "power1.inOut" }, toSrv - 0.5);
    const out = W("n8", "out to");
    tl.to(dot, { attr: { cx: 1560 }, duration: 0.8, ease: "power1.inOut" }, out);
    const back = W("n8", "and back");
    tl.to(dot, { attr: { cx: 552 }, duration: 1.1, ease: "power1.inOut" }, back - 0.1);
    show($("p-answer"), back + 0.9, 0.3);
    const saved = W("n8", "saved locally");
    tl.set(dot, { attr: { cx: 840, cy: 465 } }, saved - 0.6);
    tl.to(dot, { attr: { cy: 700 }, duration: 0.6, ease: "power1.in" }, saved - 0.5);
    tl.to(dot, { opacity: 0, duration: 0.2 }, saved + 0.1);
    show($("p-saved"), saved + 0.1, 0.3);
    const br = W("n8", "browser already");
    show($("p-browser"), br - 0.1);
    tl.to($("p-t4"), { attr: { stroke: "#2f8f5b", "stroke-width": 3 }, duration: 0.3 }, br - 0.1);
    tl.to($("p-scene"), { opacity: 0.18, duration: 0.6 }, W("n9", "That's a first run"));
    show($("p-recap"), W("n9", "That's a first run"), 0.6);
    show($("p-r1"), W("n9", "One folder") - 0.1);
    show($("p-r2"), W("n9", "one server") - 0.1);
    show($("p-r3"), W("n9", "a doctor") - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
