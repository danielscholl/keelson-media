<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 12 &nbsp;·&nbsp; ADD A CAPABILITY</span>
  </div>
  <div id="boardName"><span id="bn-before">BEFORE</span><span id="bn-snap">DATA, NOT PIXELS</span><span id="bn-why">A CAPABILITY IS A DEPENDENCY</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker>
    <marker id="ahn" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e3a5f"/></marker>
  </defs>

  <!-- BEFORE -->
  <g id="before" opacity="0">
    <g id="f-bd" opacity="0"><rect x="160" y="200" width="560" height="420" rx="16" fill="rgba(255,255,255,.8)" stroke="#1e3a5f" stroke-width="3"/>
      <text x="190" y="250" class="mono" font-size="21" letter-spacing="3" fill="#51607a">HARBOR · .beads/</text>
      <g font-size="21" class="mono">
        <rect x="200" y="290" width="220" height="56" rx="8" fill="#e8eef8" stroke="#2f6fb0" stroke-width="2"/><text x="310" y="325" text-anchor="middle" fill="#0f1b2d">days</text>
        <rect x="460" y="290" width="220" height="56" rx="8" fill="#e8eef8" stroke="#2f6fb0" stroke-width="2"/><text x="570" y="325" text-anchor="middle" fill="#0f1b2d">drift</text>
        <rect x="200" y="440" width="220" height="56" rx="8" fill="#fff" stroke="#51607a" stroke-width="2"/><text x="310" y="475" text-anchor="middle" fill="#51607a">local</text>
        <rect x="460" y="440" width="220" height="56" rx="8" fill="#fff" stroke="#51607a" stroke-width="2"/><text x="570" y="475" text-anchor="middle" fill="#51607a">chart</text>
      </g>
      <path d="M310,348 L310,436 M330,348 L540,436 M570,348 L570,436" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#ahn)"/>
      <text x="440" y="580" text-anchor="middle" class="mono" font-size="20" fill="#2f6fb0">bd · 2 ready, 2 waiting</text></g>
    <g id="f-k" opacity="0"><rect x="1000" y="200" width="760" height="420" rx="16" fill="#0d1429"/>
      <text x="1040" y="260" class="mono" font-size="24" fill="#dfe6f0">Keelson   Chat   Workflows</text>
      <line x1="1030" y1="285" x2="1730" y2="285" stroke="#2a3352" stroke-width="2"/>
      <text x="1040" y="360" class="mono" font-size="24" fill="#9aa3c0">tools: 19</text>
      <text x="1040" y="410" class="mono" font-size="24" fill="#9aa3c0">beads tools: 0</text>
      <text x="1040" y="460" class="mono" font-size="24" fill="#9aa3c0">beads views: 0</text></g>
    <g id="f-q" opacity="0"><text x="860" y="430" text-anchor="middle" font-size="54" fill="#b8433a">?</text>
      <text x="960" y="700" text-anchor="middle" font-size="30" fill="#0f1b2d">Keelson knows nothing about it</text></g>
  </g>

  <!-- DATA, NOT PIXELS -->
  <g id="snap" opacity="0">
    <g id="s-rib" opacity="0"><rect x="160" y="300" width="380" height="240" rx="16" fill="#fff" stroke="#b5803a" stroke-width="3"/>
      <text x="350" y="350" text-anchor="middle" class="mono" font-size="22" letter-spacing="3" fill="#8a5a1f">BEADS RIB</text>
      <text x="350" y="410" text-anchor="middle" class="mono" font-size="20" fill="#0f1b2d">composeBundle()</text>
      <text x="350" y="450" text-anchor="middle" class="mono" font-size="18" fill="#51607a">reads bd, returns data</text></g>
    <g id="s-keys" opacity="0"><path d="M545,420 L690,420" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ah)"/>
      <rect x="700" y="300" width="460" height="240" rx="16" fill="#0d1429"/>
      <text x="730" y="350" class="mono" font-size="20" fill="#9aa3c0">snapshots</text>
      <text x="730" y="400" class="mono" font-size="22" fill="#f2c66d">rib:beads:trackers</text>
      <text x="730" y="440" class="mono" font-size="22" fill="#f2c66d">rib:beads:pulse</text>
      <text x="730" y="480" class="mono" font-size="22" fill="#f2c66d">rib:beads:wip</text>
      <text x="730" y="520" class="mono" font-size="22" fill="#f2c66d">rib:beads:attention</text></g>
    <g id="s-ui" opacity="0"><path d="M1165,420 L1290,420" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ah)"/>
      <rect x="1300" y="260" width="460" height="320" rx="16" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
      <text x="1330" y="305" class="mono" font-size="20" fill="#1e3a5f">Beads tab · live boards</text>
      <rect x="1330" y="330" width="400" height="60" rx="8" fill="#e8eef8"/><rect x="1330" y="405" width="190" height="150" rx="8" fill="#e8eef8"/><rect x="1540" y="405" width="190" height="150" rx="8" fill="#e8eef8"/></g>
    <g id="s-never" opacity="0"><text x="960" y="660" text-anchor="middle" class="mono" font-size="22" fill="#b8433a">never: draws a pixel · opens a port · touches the database</text></g>
    <g id="s-split" opacity="0"><text x="960" y="720" text-anchor="middle" class="mono" font-size="22" fill="#8a5a1f">rib: data + declarations   ·   harness: the rest</text></g>
  </g>

  <!-- A CAPABILITY IS A DEPENDENCY -->
  <g id="why" opacity="0">
    <g id="y-cols">
      <g id="y-in" opacity="0"><rect x="200" y="230" width="560" height="120" rx="14" fill="#0d1429"/>
        <text x="230" y="285" class="mono" font-size="24" fill="#dfe6f0"><tspan fill="#b5803a">$</tspan> keelson rib add …beads</text>
        <text x="230" y="325" class="mono" font-size="24" fill="#dfe6f0"><tspan fill="#b5803a">$</tspan> keelson restart</text></g>
      <g id="y-got" opacity="0"><path d="M765,290 L880,290" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="890" y="200" width="830" height="190" rx="14" fill="#fff" stroke="#2f8f5b" stroke-width="3"/>
        <text x="920" y="260" font-size="30" font-weight="600" fill="#0f1b2d">+ a Beads tab</text>
        <text x="920" y="310" font-size="30" font-weight="600" fill="#0f1b2d">+ 15 tools in chat and workflows</text>
        <text x="920" y="360" font-size="30" font-weight="600" fill="#0f1b2d">+ 4 live views</text></g>
      <g id="y-keel" opacity="0"><rect x="260" y="480" width="1400" height="46" rx="10" fill="#1e3a5f"/><text x="960" y="511" text-anchor="middle" class="mono" font-size="22" letter-spacing="6" fill="#fff">KEELSON · UNCHANGED</text></g>
      <g id="y-out" opacity="0"><text x="960" y="600" text-anchor="middle" class="mono" font-size="23" fill="#51607a">keelson rib remove beads → gone</text></g>
    </g>
    <g id="y-recap" opacity="0">
      <rect x="460" y="300" width="1000" height="200" fill="rgba(243,245,248,.95)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="420" text-anchor="middle" font-size="50" font-weight="300" letter-spacing="7" fill="#1e3a5f" opacity="0">A CAPABILITY IS A DEPENDENCY</text>
    </g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  // BEFORE
  { show($("f-bd"), W("n1", "a backlog") - 0.2);
    show($("f-k"), W("n1", "Keelson knows") - 0.2);
    show($("f-q"), W("n1", "knows nothing") - 0.1);
  }
  // DATA, NOT PIXELS
  { show($("s-rib"), W("n5", "A rib publishes") - 0.2);
    show($("s-keys"), W("n5", "its own keys") - 0.3);
    show($("s-ui"), W("n5", "live boards") - 0.3);
    show($("s-never"), W("n5", "never draws") - 0.1);
    show($("s-split"), W("n5", "data and declarations") - 0.1);
  }
  // A CAPABILITY IS A DEPENDENCY
  { show($("y-in"), W("n8", "One command") - 0.1);
    show($("y-got"), W("n8", "A tab") - 0.2);
    show($("y-keel"), W("n8", "didn't change") - 0.4);
    show($("y-out"), W("n8", "Remove the rib") - 0.1);
    const c = W("n9", "A capability");
    tl.to($("y-cols"), { opacity: 0.15, duration: 0.5 }, c - 0.5);
    show($("y-recap"), c - 0.5, 0.4); show($("y-r1"), c - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
