fig: "04"
slug: first-workflow
title: First workflow
act: II
problem: Start the server, run the smoke test in the terminal, then run it again in the browser and watch the DAG fill in.
docs: [tutorials/run-a-workflow, concepts/workflows]
voice: en-US-Harper:MAI-Voice-2.1
bookends: { open: lay-the-keel, close: raise-the-ribs }
crossfade: 0.5

scenes:
  - id: term
    source: raw/term.mp4
    frame: viewport
    label: TERMINAL
    hold: 1.2
    marks: { start-cmd: 0.4, run-cmd: 3.2, succeeded: 14.4 }
    zoom:
      - { at: -1, until: run-cmd + 5.5, over: 0.6, box: [0, 20, 1200, 675] }      # the prompt, large
      - { at: run-cmd + 5.5, until: 99, over: 1.4, box: [0, 400, 1200, 675] }   # follow the output down to succeeded
    masks:
      - { box: [40, 178, 900, 30], color: "0x0d1429", to: 5.0 }     # log path under the home folder
      - { box: [40, 86, 700, 28], color: "0x0d1429", from: 5.0 }    # target: cwd=<home>/keelson-demo
  - id: web-find
    source: raw/web.mp4
    marks: source/web-meta.json
    frame: viewport
    label: BROWSER
    trim: [start, run + 0.7]
  - id: web-run
    source: raw/web.mp4
    marks: source/web-meta.json
    frame: viewport
    label: BROWSER
    xfade: 0.3
    trim: [start-click - 0.3, done + 0.7]
    masks:
      - { box: [70, 176, 280, 24], color: "0x0d1329" }              # CWD <home>/keelson
    zoom:
      - { at: start-click + 0.3, until: start-click + 3.0, over: 0.9, box: [40, 300, 960, 540] }   # the DAG fills in
      - { at: start-click + 3.0, until: done - 0.5, over: 0.9, box: [930, 290, 960, 540] }        # model, time, output
  - id: web-after
    source: raw/web.mp4
    marks: source/web-meta.json
    frame: viewport
    label: BROWSER
    xfade: 0.3
    trim: [expand + 0.5, runs + 2.6]
    masks:
      - { box: [70, 176, 280, 24], color: "0x0d1329", to: back }

lines:
  - { id: n1, scene: open, at: 0.6, text: "This is Keelson. An agent harness that runs on your own machine." }
  - { id: n2, scene: term, at: start-cmd, text: "Start the server with keelson start." }
  - { id: n3, scene: term, at: run-cmd, text: "Now run a workflow. The smoke test exercises every node type. Prompts, commands, loops, bash, and scripts, wired together as a DAG." }
  - { id: n4, scene: term, at: succeeded, text: "Nine nodes, a few seconds, all green." }
  - { id: n5, scene: web-find, at: 0.4, text: "Every workflow is also in the browser. Find the smoke test, and hit Run." }
  - { id: n6, scene: web-run, at: start-click + 0.3, text: "The graph lights up as each node finishes. You can see which model answered, how long it took, and the output." }
  - { id: n7, scene: web-after, at: back - 1.2, text: "And it's all stored locally, so nothing is lost when you close the tab." }
  - { id: n8, scene: close, at: 1.6, text: "Keelson. Lay the keel, raise the ribs." }
