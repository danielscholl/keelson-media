<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../tools/node_modules/gsap/dist/gsap.min.js"></script>
<style>
  :root { --keel:#1e3a5f; --rib:#2f6fb0; --brass:#b5803a; --brass-ink:#8a5a1f; --ink:#0f1b2d; --muted:#51607a; --green:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink);
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(30,58,95,.028) 1px, transparent 1px) 0 0/18px 18px,
      radial-gradient(circle at 74% 0%, rgba(255,255,255,.9), transparent 700px),
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  .crop { position:absolute; width:26px; height:26px; border:0 solid rgba(30,58,95,.5); }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1.5px solid rgba(30,58,95,.45); font-family:"JetBrains Mono", monospace; font-size:18px; letter-spacing:.2em; color:var(--keel); }
  #header .left { display:flex; align-items:center; gap:16px; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; white-space: pre; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; }
</style>
</head>
<body>
<div class="crop" style="left:40px;top:14px;border-left-width:2px;border-top-width:2px"></div>
<div class="crop" style="right:40px;top:14px;border-right-width:2px;border-top-width:2px"></div>
<div class="crop" style="left:40px;bottom:14px;border-left-width:2px;border-bottom-width:2px"></div>
<div class="crop" style="right:40px;bottom:14px;border-right-width:2px;border-bottom-width:2px"></div>
<div id="header">
  <div class="left">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none"><line x1="11.5" y1="7" x2="11.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="22.5" y1="7" x2="22.5" y2="27" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="20" x2="29" y2="20" stroke="#b5803a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span><b>KEELSON</b> &nbsp;·&nbsp; FIG. 19 &nbsp;·&nbsp; SHORTS, BY KEELSON</span>
  </div>
  <div id="boardName"><span id="bn-line">THE PRODUCTION LINE</span><span id="bn-gate">WHAT A CHECK CAN'T SEE</span><span id="bn-why">THE SERIES</span></div>
</div>

<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
  <defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5a1f"/></marker></defs>
  <g id="line" opacity="0">
    <g id="l-script" opacity="0"><rect x="120" y="330" width="250" height="300" rx="14" fill="#0d1429"/>
      <text x="145" y="375" class="mono" font-size="20" fill="#9aa3c0">short.yaml</text>
      <text x="145" y="425" class="mono" font-size="18" fill="#dfe6f0">scenes:</text>
      <text x="145" y="458" class="mono" font-size="18" fill="#f2c66d">  - b-gw</text>
      <text x="145" y="491" class="mono" font-size="18" fill="#f2c66d">  - ask</text>
      <text x="145" y="534" class="mono" font-size="18" fill="#dfe6f0">lines:</text>
      <text x="145" y="567" class="mono" font-size="18" fill="#5fd7a7">  - n1: "…"</text>
      <text x="145" y="600" class="mono" font-size="18" fill="#5fd7a7">  - n2: "…"</text></g>
    <g id="l-steps"></g>
    <g id="l-recipe" opacity="0"><path d="M440,700 L1290,700" stroke="#2f6fb0" stroke-width="3"/><text x="865" y="745" text-anchor="middle" class="mono" font-size="24" letter-spacing="3" fill="#2f6fb0">A RECIPE · SAME EVERY TIME</text></g>
    <g id="l-gate" opacity="0"><path class="draw" pathLength="1" d="M1295,480 L1375,480" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ah)"/>
      <rect x="1390" y="400" width="200" height="160" rx="14" fill="#fff8ec" stroke="#b5803a" stroke-width="3.5"/>
      <circle cx="1490" cy="455" r="20" fill="none" stroke="#8a5a1f" stroke-width="3"/><path d="M1452,520 Q1490,478 1528,520" fill="none" stroke="#8a5a1f" stroke-width="3"/>
      <text x="1490" y="600" text-anchor="middle" class="mono" font-size="22" fill="#8a5a1f">gate</text>
      <path d="M1400,700 L1580,700" stroke="#b5803a" stroke-width="3"/><text x="1490" y="745" text-anchor="middle" class="mono" font-size="24" letter-spacing="3" fill="#8a5a1f">A JUDGMENT</text></g>
    <g id="l-out" opacity="0"><path d="M1595,480 L1660,480" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ah)"/>
      <rect x="1670" y="430" width="140" height="100" rx="10" fill="#fff" stroke="#51607a" stroke-width="2.5"/><text x="1740" y="490" text-anchor="middle" class="mono" font-size="20" fill="#0f1b2d">outbox</text></g>
    <g id="l-wf" opacity="0"><text x="960" y="250" text-anchor="middle" class="mono" font-size="28" fill="#1e3a5f">workflow: cut-a-short</text></g>
  </g>
  <g id="gate" opacity="0">
    <g id="g-sheet" opacity="0"><rect x="160" y="230" width="840" height="520" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
      <text x="190" y="275" class="mono" font-size="20" fill="#51607a">review.md · contact sheet</text></g>
    <g id="g-cells"></g>
    <g id="g-checks" opacity="0"><text x="1100" y="290" class="mono" font-size="22" letter-spacing="3" fill="#51607a">A CHECK MEASURES</text>
      <text x="1100" y="345" font-size="28" fill="#2f8f5b">✓ length</text><text x="1100" y="395" font-size="28" fill="#2f8f5b">✓ loudness, −16 LUFS</text><text x="1100" y="445" font-size="28" fill="#2f8f5b">✓ no long silence</text></g>
    <g id="g-cant" opacity="0"><text x="1100" y="540" class="mono" font-size="22" letter-spacing="3" fill="#8a5a1f">A PERSON SEES</text>
      <text x="1100" y="595" font-size="28" fill="#0f1b2d">? a cursor in the wrong place</text><text x="1100" y="645" font-size="28" fill="#0f1b2d">? a caption over the answer</text></g>
    <g id="g-wait" opacity="0"><rect x="1100" y="690" width="560" height="70" rx="12" fill="#fff8ec" stroke="#b5803a" stroke-width="3"/><text x="1380" y="735" text-anchor="middle" class="mono" font-size="24" fill="#8a5a1f">the run waits on a yes</text></g>
  </g>
  <g id="why" opacity="0">
    <g id="y-cols"><g id="y-tags"></g></g>
    <g id="y-recap" opacity="0"><rect x="360" y="380" width="1200" height="200" fill="rgba(243,245,248,.96)" stroke="#1e3a5f" stroke-width="2"/>
      <text id="y-r1" x="960" y="500" text-anchor="middle" font-size="50" font-weight="300" letter-spacing="8" fill="#1e3a5f" opacity="0">CUT BY ITS OWN WORKFLOW</text></g>
  </g>
</svg>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase, k = 0) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0, hit = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w) && hit++ === k) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  const draw = (e, at, d = 0.8) => {
    const mk = e.getAttribute("marker-end");
    if (mk) { e.removeAttribute("marker-end"); tl.set(e, { attr: { "marker-end": mk } }, at + d * 0.9); }
    tl.set(e, { opacity: 1 }, at); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
  };
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  { show($("l-script"), W("n1", "A script") - 0.2);
    const g = $("l-steps"), names = [["voice", "voice the lines"], ["boards", "draw the boards"], ["compose", "compose the cut"], ["qa", "check it"]];
    names.forEach(([n, p], i) => { const x = 440 + i * 215, r = el("g", { opacity: 0 }, g);
      el("path", { d: `M${x - 60},480 L${x - 8},480`, stroke: "#8a5a1f", "stroke-width": 3, "marker-end": "url(#ah)" }, r);
      el("rect", { x, y: 420, width: 180, height: 120, rx: 14, fill: "#fff", stroke: "#2f6fb0", "stroke-width": 3 }, r);
      el("text", { x: x + 90, y: 490, "text-anchor": "middle", class: "mono", "font-size": 24, fill: "#0f1b2d" }, r, n);
      show(r, W("n1", p) - 0.2); });
    show($("l-recipe"), W("n1", "a recipe") - 0.2);
    show($("l-wf"), W("n1", "Keelson workflow") - 0.3);
    show($("l-gate"), W("n1", "a judgment") - 0.3); draw($("l-gate").querySelector(".draw"), W("n1", "a judgment") - 0.3, 0.5);
    show($("l-out"), W("n1", "a gate") + 0.2);
  }
  { show($("g-sheet"), W("n5", "contact sheet") - 0.4);
    const g = $("g-cells");
    for (let i = 0; i < 9; i++) { const x = 190 + (i % 3) * 268, y = 300 + Math.floor(i / 3) * 145;
      const r = el("rect", { x, y, width: 248, height: 130, rx: 6, fill: i % 4 === 1 ? "#0d1429" : "#e6eaf0", stroke: "#c8d2e0", opacity: 0 }, g);
      show(r, W("n5", "nine frames") - 0.2 + i * 0.07, 0.2); }
    show($("g-checks"), W("n5", "measure a cut") - 0.2);
    show($("g-cant"), W("n5", "can't see") - 0.2);
    show($("g-wait"), W("n5", "waits on it") - 0.3);
  }
  { const g = $("y-tags"), titles = ["WHAT KEELSON IS","FIRST RUN","CHAT THREE WAYS","A PLACE TO WORK","FIRST WORKFLOW","WRITE A WORKFLOW","THE APPROVAL GATE","MANY MODELS","ISSUE TO DRAFT PR","MAKE IT REMEMBER","WHERE THE TOKENS WENT","THE RIB MODEL","ADD A CAPABILITY","PLAN THE BACKLOG","THE SOFTWARE FACTORY","YOUR AGENT DRIVES IT","NO PAID KEYS","ASK FOR A REPORT","DID THAT CHANGE HELP?","SHORTS, BY KEELSON"];
    titles.forEach((t, i) => { const x = 130 + (i % 5) * 335, y = 190 + Math.floor(i / 5) * 145, r = el("g", { opacity: 0 }, g);
      el("rect", { x, y, width: 315, height: 120, rx: 10, fill: i === 19 ? "#fff8ec" : "#fff", stroke: i === 19 ? "#b5803a" : "#c8d2e0", "stroke-width": 2 }, r);
      el("text", { x: x + 22, y: y + 44, class: "mono", "font-size": 19, "letter-spacing": 2, fill: "#8a5a1f" }, r, `FIG. ${String(i).padStart(2, "0")}`);
      el("text", { x: x + 22, y: y + 86, "font-size": 19, "font-weight": 600, fill: "#0f1b2d" }, r, t);
      show(r, W("n9", "a figure") - 0.3 + i * 0.12, 0.25); });
    const a = W("n10", "This figure");
    tl.to($("y-cols"), { opacity: 0.15, duration: 0.5 }, a - 0.5); show($("y-recap"), a - 0.5, 0.4); show($("y-r1"), a - 0.1);
  }
  return tl.duration();
};
</script>
</body>
</html>
